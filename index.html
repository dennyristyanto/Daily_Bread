<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Bread Bakery App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bakery: {
                            50: '#fff7ed',
                            100: '#ffedd5',
                            200: '#fed7aa',
                            300: '#fdba74',
                            400: '#fb923c',
                            500: '#f97316',
                            600: '#ea580c',
                            700: '#c2410c',
                            800: '#9a3412',
                            900: '#7c2d12',
                            950: '#431407',
                        },
                        terracotta: {
                            50: '#fdf8f6',
                            100: '#fbeee9',
                            500: '#d97706',
                            600: '#b45309',
                            700: '#92400e',
                        },
                        cream: '#fdfbf7',
                        cardbg: '#ffffff'
                    },
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', "SF Pro Display", "SF Pro Text", "Helvetica Neue", 'Segoe UI', 'Roboto', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #2b1810;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
            overflow-x: hidden;
        }
        /* Custom scrollbars for clean mobile feel */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #fed7aa;
            border-radius: 9999px;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-0 sm:p-4">

    <!-- iPhone Device Mockup Frame -->
    <div id="app-container" class="w-full max-w-[430px] min-w-[320px] h-[100vh] sm:h-[880px] bg-cream sm:rounded-[48px] sm:shadow-2xl sm:border-[10px] sm:border-[#1e110b] flex flex-col relative overflow-hidden">
        
        <!-- Top Dynamic Notch-Free Header -->
        <header class="bg-gradient-to-r from-bakery-800 to-bakery-600 text-white px-5 pt-4 pb-4 shadow-md flex items-center justify-between shrink-0 z-20">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-2xl bg-white/15 backdrop-blur flex items-center justify-center text-bakery-100 shadow-inner">
                    <i class="fa-solid fa-wheat-awn text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg tracking-tight leading-tight">Daily Bread</h1>
                    <p class="text-xs text-bakery-100 opacity-90 font-medium">Bakery & Pastry Studio</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="togglePrivacy()" id="privacy-btn" class="w-9 h-9 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center text-bakery-100 transition" title="Sembunyikan/Tampilkan Nominal">
                    <i class="fa-solid fa-eye text-sm" id="privacy-icon"></i>
                </button>
                <button onclick="openQuickBookingModal()" class="w-9 h-9 rounded-full bg-white text-bakery-700 hover:bg-bakery-50 flex items-center justify-center shadow font-bold transition">
                    <i class="fa-solid fa-plus text-sm"></i>
                </button>
            </div>
        </header>

        <!-- Main Dynamic View Area -->
        <main class="flex-1 overflow-y-auto pb-24 relative bg-[#fdfbf7]" id="main-content">
            <!-- Dynamic tab content gets injected here -->
        </main>

        <!-- Bottom Navigation Bar -->
        <nav class="absolute bottom-0 left-0 right-0 h-20 bg-white/95 backdrop-blur-md border-t border-bakery-100 px-3 flex items-center justify-around z-30 shadow-[0_-4px_20px_rgba(0,0,0,0.06)]">
            <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center justify-center flex-1 py-1 text-bakery-600 transition group">
                <div class="w-10 h-10 rounded-full flex items-center justify-center transition group-hover:bg-bakery-50">
                    <i class="fa-solid fa-house text-lg"></i>
                </div>
                <span class="text-[11px] font-semibold tracking-tight">Home</span>
            </button>
            <button onclick="switchTab('booking')" id="nav-booking" class="flex flex-col items-center justify-center flex-1 py-1 text-gray-400 transition group">
                <div class="w-10 h-10 rounded-full flex items-center justify-center transition group-hover:bg-bakery-50">
                    <i class="fa-solid fa-calendar-days text-lg"></i>
                </div>
                <span class="text-[11px] font-medium tracking-tight">Booking</span>
            </button>
            <button onclick="switchTab('pnl')" id="nav-pnl" class="flex flex-col items-center justify-center flex-1 py-1 text-gray-400 transition group">
                <div class="w-10 h-10 rounded-full flex items-center justify-center transition group-hover:bg-bakery-50">
                    <i class="fa-solid fa-chart-pie text-lg"></i>
                </div>
                <span class="text-[11px] font-medium tracking-tight">P & L</span>
            </button>
            <button onclick="switchTab('setting')" id="nav-setting" class="flex flex-col items-center justify-center flex-1 py-1 text-gray-400 transition group">
                <div class="w-10 h-10 rounded-full flex items-center justify-center transition group-hover:bg-bakery-50">
                    <i class="fa-solid fa-gear text-lg"></i>
                </div>
                <span class="text-[11px] font-medium tracking-tight">Setting</span>
            </button>
        </nav>

        <!-- Global Notification Toast -->
        <div id="toast" class="absolute top-16 left-4 right-4 bg-gray-900/95 text-white text-xs py-3 px-4 rounded-2xl shadow-xl flex items-center justify-between z-50 transform -translate-y-24 opacity-0 transition-all duration-300 pointer-events-none backdrop-blur">
            <div class="flex items-center space-x-2.5">
                <i id="toast-icon" class="fa-solid fa-circle-check text-emerald-400 text-sm"></i>
                <span id="toast-msg" class="font-medium">Berhasil disimpan</span>
            </div>
            <button onclick="hideToast()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <!-- Quick Booking / Add Order Modal -->
        <div id="booking-modal" class="absolute inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden transition-opacity">
            <div class="bg-white w-full sm:max-w-md rounded-t-[32px] sm:rounded-[32px] max-h-[90vh] flex flex-col shadow-2xl overflow-hidden animate-slide-up">
                <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between bg-bakery-50/50">
                    <h3 class="font-bold text-gray-900 text-base" id="modal-title">Buat Booking Baru</h3>
                    <button onclick="closeBookingModal()" class="w-8 h-8 rounded-full bg-gray-200/70 hover:bg-gray-300 flex items-center justify-center text-gray-600 transition"><i class="fa-solid fa-xmark text-sm"></i></button>
                </div>
                <form id="booking-form" onsubmit="handleBookingSubmit(event)" class="p-6 overflow-y-auto space-y-4 flex-1">
                    <input type="hidden" id="edit-booking-id">
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Nama Pemesan</label>
                        <input type="text" id="order-customer" required class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-sm text-gray-800 focus:outline-none focus:border-bakery-500 font-medium" placeholder="Contoh: Ibu Siska">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-gray-700 mb-1">Tanggal Kirim</label>
                            <input type="date" id="order-date" required class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2.5 text-sm text-gray-800 focus:outline-none focus:border-bakery-500 font-medium">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-700 mb-1">Jam Ambil/Kirim</label>
                            <input type="time" id="order-time" required class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2.5 text-sm text-gray-800 focus:outline-none focus:border-bakery-500 font-medium" value="10:00">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Pilih Menu Roti / Kue</label>
                        <div id="modal-menu-items" class="space-y-2 max-h-40 overflow-y-auto pr-1 border border-gray-100 rounded-xl p-2 bg-gray-50/50">
                            <!-- Populated dynamically -->
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-gray-700 mb-1">Jumlah (Qty)</label>
                            <input type="number" id="order-qty" min="1" value="1" required oninput="calculateModalTotal()" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-sm text-gray-800 focus:outline-none focus:border-bakery-500 font-medium">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-700 mb-1">Status Pesanan</label>
                            <select id="order-status" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2.5 text-sm text-gray-800 focus:outline-none focus:border-bakery-500 font-medium">
                                <option value="Pending">Pending</option>
                                <option value="Proses">Diproses</option>
                                <option value="Selesai">Selesai</option>
                                <option value="Batal">Dibatalkan</option>
                            </select>
                        </div>
                    </div>
                    <div class="bg-bakery-50/60 p-3.5 rounded-2xl border border-bakery-200 flex items-center justify-between">
                        <div>
                            <p class="text-[11px] text-bakery-700 font-medium">Estimasi Total Tagihan</p>
                            <p class="text-base font-bold text-bakery-900" id="modal-total-preview">Rp 0</p>
                        </div>
                        <div class="text-right">
                            <p class="text-[11px] text-gray-500 font-medium">Estimasi HPP</p>
                            <p class="text-xs font-bold text-gray-700" id="modal-hpp-preview">Rp 0</p>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Catatan Khusus (Opsional)</label>
                        <input type="text" id="order-notes" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-sm text-gray-800 focus:outline-none focus:border-bakery-500 font-medium" placeholder="Misal: Tanpa taburan keju, ucapan selamat ulang tahun">
                    </div>
                    <div class="pt-2">
                        <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-bakery-600 to-bakery-700 hover:from-bakery-700 hover:to-bakery-800 text-white rounded-2xl font-bold shadow-lg shadow-bakery-600/30 transition text-sm">
                            Simpan Booking
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Menu Item Add/Edit Modal (Setting Tab) -->
        <div id="menu-modal" class="absolute inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden transition-opacity">
            <div class="bg-white w-full sm:max-w-md rounded-t-[32px] sm:rounded-[32px] max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
                <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between bg-bakery-50/50">
                    <h3 class="font-bold text-gray-900 text-base" id="menu-modal-title">Tambah Menu Baru</h3>
                    <button onclick="closeMenuModal()" class="w-8 h-8 rounded-full bg-gray-200/70 hover:bg-gray-300 flex items-center justify-center text-gray-600 transition"><i class="fa-solid fa-xmark text-sm"></i></button>
                </div>
                <form id="menu-form" onsubmit="handleMenuSubmit(event)" class="p-6 overflow-y-auto space-y-4 flex-1">
                    <input type="hidden" id="edit-menu-id">
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Nama Produk / Roti</label>
                        <input type="text" id="menu-name" required class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-sm text-gray-800 focus:outline-none focus:border-bakery-500 font-medium" placeholder="Misal: Sourdough Loaf 500g">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Kategori</label>
                        <select id="menu-category" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2.5 text-sm text-gray-800 focus:outline-none focus:border-bakery-500 font-medium">
                            <option value="Roti Artisanal">Roti Artisanal</option>
                            <option value="Pastry & Croissant">Pastry & Croissant</option>
                            <option value="Cake & Tart">Cake & Tart</option>
                            <option value="Cookies & Snack">Cookies & Snack</option>
                            <option value="Minuman">Minuman</option>
                        </select>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-gray-700 mb-1">HPP (Modal) - Rp</label>
                            <input type="number" id="menu-hpp" min="0" required class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-sm text-gray-800 focus:outline-none focus:border-bakery-500 font-medium" placeholder="12000">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-700 mb-1">Harga Jual - Rp</label>
                            <input type="number" id="menu-price" min="0" required class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-sm text-gray-800 focus:outline-none focus:border-bakery-500 font-medium" placeholder="22000">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Deskripsi Singkat</label>
                        <input type="text" id="menu-desc" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-sm text-gray-800 focus:outline-none focus:border-bakery-500 font-medium" placeholder="Dibuat dengan ragi alami...">
                    </div>
                    <div class="pt-2">
                        <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-bakery-600 to-bakery-700 hover:from-bakery-700 hover:to-bakery-800 text-white rounded-2xl font-bold shadow-lg shadow-bakery-600/30 transition text-sm">
                            Simpan Menu
                        </button>
                    </div>
                </form>
            </div>
        </div>

    </div>

    <script>
        // --- Application State ---
        let currentTab = 'home';
        let privacyMode = false;

        // Default Menus
        let menuItems = [
            { id: 1, name: 'Sourdough Country Loaf', category: 'Roti Artisanal', hpp: 18000, price: 35000, desc: 'Classic fermented sourdough bread' },
            { id: 2, name: 'Butter Croissant', category: 'Pastry & Croissant', hpp: 7500, price: 16000, desc: 'Flaky and buttery French pastry' },
            { id: 3, name: 'Choco Lava Danish', category: 'Pastry & Croissant', hpp: 9000, price: 19000, desc: 'Rich chocolate pastry' },
            { id: 4, name: 'Japanese Milk Bread', category: 'Roti Artisanal', hpp: 14000, price: 28000, desc: 'Soft and fluffy shokupan loaf' },
            { id: 5, name: 'Almond Croissant', category: 'Pastry & Croissant', hpp: 11000, price: 24000, desc: 'Filled with almond cream and sliced almonds' },
            { id: 6, name: 'Fudge Brownie Slice', category: 'Cake & Tart', hpp: 8000, price: 18000, desc: 'Dense dark chocolate fudge brownie' }
        ];

        // Default Bookings (including dates around today)
        const todayDateObj = new Date();
        const formatDateStr = (d) => {
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        };

        const todayStr = formatDateStr(todayDateObj);
        
        let bookings = [
            { id: 101, customer: 'Bpk. Budi Santoso', date: todayStr, time: '08:30', menuId: 1, qty: 3, status: 'Proses', notes: 'Iris tebal' },
            { id: 102, customer: 'Ibu Ratna', date: todayStr, time: '10:00', menuId: 2, qty: 10, status: 'Selesai', notes: 'Box isi 10' },
            { id: 103, customer: 'Cafe Senja', date: todayStr, time: '14:15', menuId: 4, qty: 5, status: 'Pending', notes: 'Langsungantar' },
            { id: 104, customer: 'Anisa Maharani', date: formatDateStr(new Date(todayDateObj.getTime() + 86400000)), time: '09:00', menuId: 5, qty: 4, status: 'Pending', notes: 'Untuk ulang tahun' },
            { id: 105, customer: 'Pak Joko', date: formatDateStr(new Date(todayDateObj.getTime() + 2 * 86400000)), time: '11:30', menuId: 3, qty: 6, status: 'Proses', notes: '' },
            { id: 106, customer: 'Hotel Merdeka', date: formatDateStr(new Date(todayDateObj.getTime() - 86400000)), time: '07:00', menuId: 1, qty: 15, status: 'Selesai', notes: 'Breakfast supply' },
        ];

        // Format Currency Helper
        function formatIDR(amount) {
            if (privacyMode) return 'Rp ••••••';
            return 'Rp ' + Number(amount).toLocaleString('id-ID');
        }

        // Toggle Privacy Mask
        function togglePrivacy() {
            privacyMode = !privacyMode;
            const icon = document.getElementById('privacy-icon');
            icon.className = privacyMode ? 'fa-solid fa-eye-slash text-sm' : 'fa-solid fa-eye text-sm';
            renderCurrentTab();
        }

        // Toast notification helper
        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-msg');
            const toastIcon = document.getElementById('toast-icon');
            toastMsg.innerText = msg;
            toastIcon.className = isError ? 'fa-solid fa-circle-exclamation text-red-400 text-sm' : 'fa-solid fa-circle-check text-emerald-400 text-sm';
            toast.classList.remove('-translate-y-24', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            setTimeout(() => hideToast(), 3000);
        }

        function hideToast() {
            const toast = document.getElementById('toast');
            toast.classList.remove('translate-y-0', 'opacity-100');
            toast.classList.add('-translate-y-24', 'opacity-0');
        }

        // Tab Switcher
        function switchTab(tabName) {
            currentTab = tabName;
            ['home', 'booking', 'pnl', 'setting'].forEach(t => {
                const btn = document.getElementById(`nav-${t}`);
                if (t === tabName) {
                    btn.className = 'flex flex-col items-center justify-center flex-1 py-1 text-bakery-600 transition group font-bold';
                    btn.querySelector('div').className = 'w-10 h-10 rounded-full bg-bakery-50 flex items-center justify-center transition';
                    btn.querySelector('span').className = 'text-[11px] font-bold tracking-tight text-bakery-700';
                } else {
                    btn.className = 'flex flex-col items-center justify-center flex-1 py-1 text-gray-400 transition group';
                    btn.querySelector('div').className = 'w-10 h-10 rounded-full flex items-center justify-center transition group-hover:bg-bakery-50';
                    btn.querySelector('span').className = 'text-[11px] font-medium tracking-tight text-gray-500';
                }
            });
            renderCurrentTab();
        }

        function renderCurrentTab() {
            const container = document.getElementById('main-content');
            if (currentTab === 'home') renderHomeTab(container);
            else if (currentTab === 'booking') renderBookingTab(container);
            else if (currentTab === 'pnl') renderPnlTab(container);
            else if (currentTab === 'setting') renderSettingTab(container);
        }

        // --- 1. HOME TAB (7-Day Chronological Schedule & Quick Booking) ---
        function renderHomeTab(container) {
            // Generate 7 days (Past 1 day, Today, Next 5 days)
            let daysList = [];
            for (let i = -1; i <= 5; i++) {
                let d = new Date();
                d.setDate(d.getDate() + i);
                daysList.push({
                    dateObj: d,
                    dateStr: formatDateStr(d),
                    dayName: d.toLocaleDateString('id-ID', { weekday: 'short' }),
                    dayNum: d.getDate(),
                    monthName: d.toLocaleDateString('id-ID', { month: 'short' }),
                    isToday: i === 0
                });
            }

            let todayRevenue = 0;
            let todayOrdersCount = 0;
            bookings.forEach(b => {
                if (b.date === todayStr && b.status !== 'Batal') {
                    const menu = menuItems.find(m => m.id == b.menuId);
                    if (menu) todayRevenue += menu.price * b.qty;
                    todayOrdersCount++;
                }
            });

            let html = `
                <div class="p-4 space-y-4">
                    <!-- Daily Summary Banner -->
                    <div class="bg-gradient-to-br from-bakery-500 to-bakery-700 rounded-3xl p-5 text-white shadow-xl relative overflow-hidden">
                        <div class="absolute -right-6 -bottom-6 w-32 h-32 bg-white/10 rounded-full pointer-events-none"></div>
                        <div class="flex justify-between items-start mb-3">
                            <div>
                                <p class="text-xs uppercase tracking-wider text-bakery-100 font-semibold">Jadwal Hari Ini</p>
                                <h2 class="text-xl font-bold tracking-tight">${new Date().toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}</h2>
                            </div>
                            <span class="bg-white/20 px-3 py-1 rounded-full text-xs font-bold backdrop-blur">${todayOrdersCount} Pesanan</span>
                        </div>
                        <div class="grid grid-cols-2 gap-3 pt-2 border-t border-white/15">
                            <div>
                                <p class="text-[11px] text-bakery-100">Potensi Omset Hari Ini</p>
                                <p class="text-lg font-extrabold">${formatIDR(todayRevenue)}</p>
                            </div>
                            <div class="text-right">
                                <button onclick="openQuickBookingModal()" class="bg-white text-bakery-800 text-xs font-bold px-4 py-2.5 rounded-2xl shadow hover:bg-bakery-50 transition inline-flex items-center space-x-1.5 mt-1">
                                    <i class="fa-solid fa-plus text-bakery-600"></i>
                                    <span>Booking Cepat</span>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- 7-Day Horizontal Date Bar -->
                    <div class="bg-white rounded-3xl p-3.5 shadow-sm border border-bakery-100">
                        <p class="text-xs font-bold text-gray-700 mb-2 px-1 flex items-center justify-between">
                            <span><i class="fa-solid fa-calendar-week text-bakery-500 mr-1.5"></i> Kalender 7 Hari Kedepan</span>
                            <span class="text-[10px] text-gray-400 font-normal">Geser untuk melihat</span>
                        </p>
                        <div class="flex space-x-2 overflow-x-auto hide-scrollbar pb-1">
            `;

            daysList.forEach(day => {
                const dayOrders = bookings.filter(b => b.date === day.dateStr && b.status !== 'Batal');
                const isSelected = (day.dateStr === selectedDateFilter);
                
                html += `
                    <div onclick="filterHomeDate('${day.dateStr}')" class="flex-shrink-0 w-16 py-3 px-1 rounded-2xl text-center cursor-pointer transition border ${day.isToday ? 'border-bakery-500' : 'border-gray-100'} ${isSelected ? 'bg-bakery-600 text-white shadow-md' : 'bg-gray-50/80 hover:bg-bakery-50 text-gray-800'}">
                        <p class="text-[10px] font-semibold uppercase ${isSelected ? 'text-bakery-100' : 'text-gray-500'}">${day.dayName}</p>

                        </h3>
                        <div class="space-y-2 text-xs text-gray-600">
                            <div class="flex justify-between py-1 border-b border-gray-50">
                                <span class="font-medium text-gray-500">Nama Toko</span>
                                <span class="font-bold text-gray-900">Daily Bread Bakery Studio</span>
                            </div>
                            <div class="flex justify-between py-1 border-b border-gray-50">
                                <span class="font-medium text-gray-500">Mata Uang</span>
                                <span class="font-bold text-gray-900">IDR (Rupiah)</span>
                            </div>
                            <div class="flex justify-between py-1">
                                <span class="font-medium text-gray-500">Status Sistem</span>
                                <span class="font-bold text-emerald-600 flex items-center"><i class="fa-solid fa-circle text-[8px] mr-1.5 text-emerald-500 animate-pulse"></i> Aktif & Tersimpan</span>
                            </div>
                        </div>
                        <div class="pt-2">
                            <button onclick="resetDefaultData()" class="w-full py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl font-bold text-xs transition">
                                Reset Data Dummy Awal
                            </button>
                        </div>
                    </div>
                </div>
            `;
            container.innerHTML = html;
        }

        function filterMenuCategory(cat) {
            settingMenuCategoryFilter = cat;
            renderCurrentTab();
        }


        // --- Modal Handlers for Bookings ---
        function openQuickBookingModal() {
            document.getElementById('modal-title').innerText = 'Buat Booking Baru';
            document.getElementById('edit-booking-id').value = '';
            document.getElementById('order-customer').value = '';
            document.getElementById('order-date').value = selectedDateFilter;
            document.getElementById('order-time').value = '10:00';
            document.getElementById('order-qty').value = 1;
            document.getElementById('order-status').value = 'Pending';
            document.getElementById('order-notes').value = '';
            renderModalMenuItems(menuItems[0]?.id || 0);
            document.getElementById('booking-modal').classList.remove('hidden');
        }

        function openQuickBookingModalWithDate(dateStr) {
            openQuickBookingModal();
            document.getElementById('order-date').value = dateStr;
        }

        function closeBookingModal() {
            document.getElementById('booking-modal').classList.add('hidden');
        }

        function renderModalMenuItems(selectedId) {
            const container = document.getElementById('modal-menu-items');
            let html = '';
            menuItems.forEach(m => {
                const isSelected = Number(selectedId) === Number(m.id);
                html += `
                    <label class="flex items-center justify-between p-2 rounded-xl cursor-pointer transition border ${isSelected ? 'bg-bakery-50 border-bakery-300' : 'bg-white border-gray-100 hover:bg-gray-50'}">
                        <div class="flex items-center space-x-2.5">
                            <input type="radio" name="modal_menu_radio" value="${m.id}" ${isSelected ? 'checked' : ''} onchange="calculateModalTotal()" class="text-bakery-600 focus:ring-bakery-500">
                            <div>
                                <p class="text-xs font-bold text-gray-900">${m.name}</p>
                                <p class="text-[10px] text-gray-400">${m.category}</p>
                            </div>
                        </div>
                        <span class="text-xs font-extrabold text-bakery-800">${formatIDR(m.price)}</span>
                    </label>
                `;
            });
            container.innerHTML = html;
            calculateModalTotal();
        }

        function calculateModalTotal() {
            const radios = document.querySelectorAll('input[name="modal_menu_radio"]');
            let selectedMenuId = menuItems[0]?.id;
            radios.forEach(r => { if (r.checked) selectedMenuId = r.value; });

            const qty = parseInt(document.getElementById('order-qty').value) || 1;
            const menu = menuItems.find(m => m.id == selectedMenuId);

            if (menu) {
                document.getElementById('modal-total-preview').innerText = formatIDR(menu.price * qty);
                document.getElementById('modal-hpp-preview').innerText = formatIDR(menu.hpp * qty);
            }
        }

        function handleBookingSubmit(e) {
            e.preventDefault();
            const editId = document.getElementById('edit-booking-id').value;
            const customer = document.getElementById('order-customer').value;
            const date = document.getElementById('order-date').value;
            const time = document.getElementById('order-time').value;
            const qty = parseInt(document.getElementById('order-qty').value);
            const status = document.getElementById('order-status').value;
            const notes = document.getElementById('order-notes').value;

            const radios = document.querySelectorAll('input[name="modal_menu_radio"]');
            let menuId = menuItems[0]?.id;
            radios.forEach(r => { if (r.checked) menuId = parseInt(r.value); });

            if (editId) {
                const order = bookings.find(b => b.id == editId);
                if (order) {
                    order.customer = customer;
                    order.date = date;
                    order.time = time;
                    order.menuId = menuId;
                    order.qty = qty;
                    order.status = status;
                    order.notes = notes;
                    showToast('Booking berhasil diperbarui!');
                }
            } else {
                const newOrder = {
                    id: Date.now(),
                    customer,
                    date,
                    time,
                    menuId,
                    qty,
                    status,
                    notes
                };
                bookings.push(newOrder);
                showToast('Booking baru berhasil dibuat!');
            }

            closeBookingModal();
            renderCurrentTab();
        }

        function editBooking(id) {
            const order = bookings.find(b => b.id === id);
            if (!order) return;

            document.getElementById('modal-title').innerText = 'Edit Pesanan Booking';
            document.getElementById('edit-booking-id').value = order.id;
            document.getElementById('order-customer').value = order.customer;
            document.getElementById('order-date').value = order.date;
            document.getElementById('order-time').value = order.time;
            document.getElementById('order-qty').value = order.qty;
            document.getElementById('order-status').value = order.status;
            document.getElementById('order-notes').value = order.notes || '';
            renderModalMenuItems(order.menuId);
            document.getElementById('booking-modal').classList.remove('hidden');
        }

        function deleteBooking(id) {
            if (confirm('Hapus pesanan ini dari daftar?')) {
                bookings = bookings.filter(b => b.id !== id);
                showToast('Pesanan berhasil dihapus');
                renderCurrentTab();
            }
        }


        // --- Modal Handlers for Menu CRUD ---
        function openMenuModal() {
            document.getElementById('menu-modal-title').innerText = 'Tambah Menu Roti Baru';
            document.getElementById('edit-menu-id').value = '';
            document.getElementById('menu-name').value = '';
            document.getElementById('menu-category').value = 'Roti Artisanal';
            document.getElementById('menu-hpp').value = '';
            document.getElementById('menu-price').value = '';
            document.getElementById('menu-desc').value = '';
            document.getElementById('menu-modal').classList.remove('hidden');
        }

        function closeMenuModal() {
            document.getElementById('menu-modal').classList.add('hidden');
        }

        function handleMenuSubmit(e) {
            e.preventDefault();
            const editId = document.getElementById('edit-menu-id').value;
            const name = document.getElementById('menu-name').value;
            const category = document.getElementById('menu-category').value;
            const hpp = parseFloat(document.getElementById('menu-hpp').value);
            const price = parseFloat(document.getElementById('menu-price').value);
            const desc = document.getElementById('menu-desc').value;

            if (editId) {
                const menu = menuItems.find(m => m.id == editId);
                if (menu) {
                    menu.name = name;
                    menu.category = category;
                    menu.hpp = hpp;
                    menu.price = price;
                    menu.desc = desc;
                    showToast('Menu berhasil diperbarui!');
                }
            } else {
                const newMenu = {
                    id: Date.now(),
                    name,
                    category,
                    hpp,
                    price,
                    desc
                };
                menuItems.push(newMenu);
                showToast('Menu baru berhasil ditambahkan!');
            }

            closeMenuModal();
            renderCurrentTab();
        }

        function editMenu(id) {
            const menu = menuItems.find(m => m.id === id);
            if (!menu) return;

            document.getElementById('menu-modal-title').innerText = 'Edit Menu Roti';
            document.getElementById('edit-menu-id').value = menu.id;
            document.getElementById('menu-name').value = menu.name;
            document.getElementById('menu-category').value = menu.category;
            document.getElementById('menu-hpp').value = menu.hpp;
            document.getElementById('menu-price').value = menu.price;
            document.getElementById('menu-desc').value = menu.desc || '';
            document.getElementById('menu-modal').classList.remove('hidden');
        }

        function deleteMenu(id) {
            if (confirm('Hapus menu ini? Menu yang terhubung dengan pesanan lama akan tetap aman.')) {
                menuItems = menuItems.filter(m => m.id !== id);
                showToast('Menu berhasil dihapus');
                renderCurrentTab();
            }
        }

        function resetDefaultData() {
            if (confirm('Reset seluruh data ke kondisi awal?')) {
                location.reload();
            }
        }

        // Initial render on window load
        window.onload = function() {
            renderCurrentTab();
        };
    </script>
</body>
</html>
