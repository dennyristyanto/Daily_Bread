    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #2b1810;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
            overflow-x: hidden;
        }
        /* Custom scrollbars for clean mobile feel */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #fed7aa;
            border-radius: 9999px;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* --- Invoice preview (A4 @ 96dpi = 794 x 1123 px, di-scale agar muat layar) --- */
        .inv-scale-wrap { position: relative; margin: 0 auto; overflow: hidden; }
        .inv-paper {
            position: absolute; top: 0; left: 0;
            width: 794px; min-height: 1123px;
            transform-origin: top left;
            background: #fff; color: #1f2937;
            padding: 68px 68px 60px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.12);
            font-family: Helvetica, Arial, sans-serif;
            display: flex; flex-direction: column;
        }
        .inv-paper::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 19px; background: #ea580c; }
        .inv-paper * { box-sizing: border-box; }
        .inv-head { display: flex; justify-content: space-between; align-items: flex-start; padding-bottom: 22px; border-bottom: 1px solid #e5e7eb; }
        .inv-brand { display: flex; align-items: center; gap: 14px; }
        .inv-logo { height: 92px; width: auto; aspect-ratio: 441 / 480; object-fit: contain; display: block; flex-shrink: 0; }
        .inv-brand-text { display: flex; flex-direction: column; justify-content: center; }
        .inv-brand-name { font-size: 26px; font-weight: 700; color: #111827; line-height: 1.1; }
        .inv-brand-sub { font-size: 14px; font-weight: 400; color: #6b7280; margin-top: 4px; }
        .inv-title { text-align: right; }
        .inv-title h2 { font-size: 38px; font-weight: 800; letter-spacing: 3px; color: #c2410c; margin: 0; line-height: 1; }
        .inv-title p { font-size: 14px; color: #4b5563; margin-top: 8px; }
        .inv-info { display: flex; justify-content: space-between; gap: 32px; margin-top: 30px; }
        .inv-label { font-size: 11px; font-weight: 700; letter-spacing: 1px; color: #6b7280; text-transform: uppercase; }
        .inv-customer { font-size: 20px; font-weight: 700; color: #111827; margin-top: 8px; word-break: break-word; max-width: 320px; }
        .inv-meta { width: 292px; font-size: 13.5px; }
        .inv-meta-row { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; }
        .inv-meta-row span:first-child { color: #6b7280; }
        .inv-meta-row span:last-child { font-weight: 700; color: #111827; text-align: right; }
        .inv-status { display: inline-block; border: 1.5px solid #374151; border-radius: 999px; padding: 1px 10px; font-size: 12px; }
        .inv-table { width: 100%; border-collapse: collapse; margin-top: 34px; font-size: 13.5px; }
        .inv-table th { background: #c2410c; color: #fff; font-size: 12px; font-weight: 700; text-align: left; padding: 10px 12px; }
        .inv-table td { padding: 12px; border-bottom: 1px solid #e5e7eb; vertical-align: top; }
        .inv-table .r { text-align: right; } .inv-table .c { text-align: center; }
        .inv-item-name { font-weight: 700; color: #111827; word-break: break-word; }
        .inv-item-sub { font-size: 11.5px; color: #6b7280; margin-top: 3px; word-break: break-word; }
        .inv-muted { color: #9ca3af; font-style: italic; }
        .inv-totals { margin-left: auto; width: 292px; margin-top: 18px; font-size: 13.5px; }

    <script>
        // --- Application State ---
        let currentTab = 'home';
        let privacyMode = false;

        // Default Menus
        // --- Kategori produk: nilai tersimpan stabil (key) + label tampilan ---
        const PRODUCT_CATEGORIES = Object.freeze([
            { key: 'cake_tart', label: 'Cake & Tart' },
            { key: 'pastry',    label: 'Pastry' },
            { key: 'brownies',  label: 'Brownies' }
        ]);
        const CATEGORY_KEYS = PRODUCT_CATEGORIES.map(c => c.key);
        function isValidCategory(key) {
            return CATEGORY_KEYS.includes(key);
        }
        function getCategoryLabel(key) {
            const cat = PRODUCT_CATEGORIES.find(c => c.key === key);
            return cat ? cat.label : null;
        }

        // Migrasi aman kategori lama (Roti Artisanal, Pastry & Croissant, dll.) -> kategori baru.
        // Produk TIDAK dihapus. Jika tidak bisa dipetakan, category = null dan harus dipilih manual lewat Edit.
        const LEGACY_CATEGORY_MAP = {
            'cake & tart': 'cake_tart', 'cake': 'cake_tart', 'tart': 'cake_tart',
            'pastry & croissant': 'pastry', 'pastry': 'pastry', 'croissant': 'pastry',
            'brownies': 'brownies', 'brownie': 'brownies'
        };
        function guessCategoryFromName(name) {
            const n = String(name || '').toLowerCase();
            if (/brownie/.test(n)) return 'brownies';
            if (/cake|tart/.test(n)) return 'cake_tart';
            if (/croissant|danish|pastry|pain au|puff|strudel/.test(n)) return 'pastry';
            return null;
        }
        function resolveLegacyCategory(item) {
            const raw = String(item.category ?? '').trim();
            if (isValidCategory(raw)) return raw;
            if (guessCategoryFromName(item.name) === 'brownies') return 'brownies';
            return LEGACY_CATEGORY_MAP[raw.toLowerCase()] || guessCategoryFromName(item.name) || null;
        }
        function migrateMenuCategories() {
            let migrated = 0;
            menuItems.forEach(m => {
                if (isValidCategory(m.category)) return;
                const next = resolveLegacyCategory(m);
                if (m.category !== next) {
                    m.legacyCategory = m.category; // simpan nilai lama sebagai jejak migrasi
                    m.category = next;
                    migrated++;
                }
            });
            return migrated;
        }

        // Data contoh produk (ID tetap agar pesanan contoh tetap terhubung ke produk)
        const SAMPLE_PRODUCTS = Object.freeze([
            { id: 7, name: 'Chocolate Fudge Cake',     category: 'cake_tart', hpp: 120000, price: 220000, desc: 'Rich chocolate cake with creamy fudge frosting' },
            { id: 5, name: 'Strawberry Shortcake',     category: 'cake_tart', hpp: 110000, price: 200000, desc: 'Soft vanilla cake with fresh strawberry and cream' },
            { id: 1, name: 'Lemon Tart',               category: 'cake_tart', hpp: 18000,  price: 35000,  desc: 'Buttery tart shell with fresh lemon custard' },
            { id: 2, name: 'Butter Croissant',         category: 'pastry',    hpp: 7500,   price: 16000,  desc: 'Flaky and buttery French pastry' },
            { id: 3, name: 'Pain au Chocolat',         category: 'pastry',    hpp: 9000,   price: 19000,  desc: 'Buttery laminated pastry filled with chocolate' },
            { id: 4, name: 'Cheese Danish',            category: 'pastry',    hpp: 10000,  price: 22000,  desc: 'Flaky Danish pastry with creamy cheese filling' },
            { id: 6, name: 'Fudgy Chocolate Brownies', category: 'brownies',  hpp: 55000,  price: 95000,  desc: 'Rich and moist dark chocolate brownies' },
            { id: 8, name: 'Walnut Brownies',          category: 'brownies',  hpp: 65000,  price: 110000, desc: 'Fudgy chocolate brownies topped with walnuts' },
            { id: 9, name: 'Cheese Brownies',          category: 'brownies',  hpp: 60000,  price: 105000, desc: 'Chocolate brownies with a creamy cheese layer' }
        ]);

        // Data contoh hanya dibuat satu kali: dilewati jika produk dengan nama sama sudah ada.
        let sampleProductsSeeded = false;
        function seedSampleProducts() {
            if (sampleProductsSeeded) return 0;
            let added = 0;
            SAMPLE_PRODUCTS.forEach(sample => {
                const exists = menuItems.some(m => String(m.name || '').trim().toLowerCase() === sample.name.toLowerCase());
                if (exists) return;
                const idTaken = menuItems.some(m => m.id === sample.id);
                menuItems.push({ ...sample, id: idTaken ? Date.now() + added : sample.id });
                added++;
            });
            sampleProductsSeeded = true;
            return added;
        }

        let menuItems = [];
        migrateMenuCategories();
        seedSampleProducts();

        // Default Bookings (including dates around today)
        const todayDateObj = new Date();
        const formatDateStr = (d) => {
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        };

        const todayStr = formatDateStr(todayDateObj);
        
        let bookings = [
            { id: 101, customer: 'Bpk. Budi Santoso', date: todayStr, time: '08:30', menuId: 1, qty: 3, status: 'Proses', notes: 'Iris tebal' },
            { id: 102, customer: 'Ibu Ratna', date: todayStr, time: '10:00', menuId: 2, qty: 10, status: 'Selesai', notes: 'Box isi 10' },
            { id: 103, customer: 'Cafe Senja', date: todayStr, time: '14:15', menuId: 4, qty: 5, status: 'Pending', notes: 'Langsungantar' },
            { id: 104, customer: 'Anisa Maharani', date: formatDateStr(new Date(todayDateObj.getTime() + 86400000)), time: '09:00', menuId: 5, qty: 4, status: 'Pending', notes: 'Untuk ulang tahun' },
            { id: 105, customer: 'Pak Joko', date: formatDateStr(new Date(todayDateObj.getTime() + 2 * 86400000)), time: '11:30', menuId: 3, qty: 6, status: 'Proses', notes: '' },
            { id: 106, customer: 'Hotel Merdeka', date: formatDateStr(new Date(todayDateObj.getTime() - 86400000)), time: '07:00', menuId: 1, qty: 15, status: 'Selesai', notes: 'Breakfast supply' },
        ];

        // =====================================================================
        // --- ITEM PESANAN (multi-produk) ---
        // Struktur booking: items: [{ productId, productName, category, quantity,
        //                            unitPrice, unitHpp, subtotal, subtotalHpp }]
        // unitPrice/unitHpp = snapshot saat booking dibuat (riwayat tidak berubah saat harga menu diubah).
        // Booking lama (menuId + qty) tetap didukung lewat getOrderItems() & migrasi aman.
        // =====================================================================
        function toMoneyOrNull(v) {
            const n = Number(v);
            return (v !== null && v !== '' && Number.isFinite(n) && n >= 0) ? n : null;
        }
        function toValidQty(v) {
            const n = Number(v);
            return Number.isFinite(n) && n >= 1 ? Math.floor(n) : 1;
        }
        function isValidQtyInput(v) {
            const n = Number(v);
            return Number.isInteger(n) && n >= 1;
        }
        function buildOrderItem(src) {
            const quantity = toValidQty(src.quantity);
            const unitPrice = toMoneyOrNull(src.unitPrice);
            const unitHpp = toMoneyOrNull(src.unitHpp);
            return {
                productId: src.productId,
                productName: src.productName || null,
                category: src.category || null,
                quantity,
                unitPrice,
                unitHpp,
                subtotal: unitPrice === null ? null : unitPrice * quantity,
                subtotalHpp: unitHpp === null ? null : unitHpp * quantity
            };
        }
        // Gabungkan produk yang sama (cegah duplikat), qty dijumlahkan
        function mergeOrderItems(list) {
            const map = new Map();
            (list || []).forEach(it => {
                if (!it || it.productId === undefined || it.productId === null) return;
                const key = String(it.productId);
                if (map.has(key)) map.get(key).quantity = toValidQty(map.get(key).quantity) + toValidQty(it.quantity);
                else map.set(key, { ...it, quantity: toValidQty(it.quantity) });
            });
            return [...map.values()];
        }
        function getOrderItems(order) {
            if (!order) return [];
            if (Array.isArray(order.items)) return mergeOrderItems(order.items).map(buildOrderItem);
            // Kompatibilitas: booking lama satu produk (menuId + qty) yang belum termigrasi
            if (order.menuId !== undefined && order.menuId !== null) {
                const menu = menuItems.find(m => m.id == order.menuId) || null;
                return [buildOrderItem({
                    productId: order.menuId,
                    productName: menu ? menu.name : null,
                    category: menu ? menu.category : null,
                    quantity: order.qty,
                    unitPrice: menu ? menu.price : null,
                    unitHpp: menu ? menu.hpp : null
                })];
            }
            return [];
        }
        function getOrderTotals(order) {
            const items = getOrderItems(order);
            const sum = (key) => items.reduce((s, i) => s + (i[key] || 0), 0);
            return {
                items,
                total: items.length && items.every(i => i.subtotal !== null) ? sum('subtotal') : null,       // null = ada harga yang tidak diketahui
                totalHpp: items.length && items.every(i => i.subtotalHpp !== null) ? sum('subtotalHpp') : null,
                knownRevenue: sum('subtotal'),   // untuk agregasi (item tanpa harga dihitung 0, sama seperti sebelumnya)
                knownHpp: sum('subtotalHpp'),
                totalQty: items.reduce((s, i) => s + i.quantity, 0)
            };
        }
        // Ringkasan item untuk kartu: "2x Cheese Danish" per baris
        function renderOrderItemsSummaryHTML(order, lineClass) {
            const items = getOrderItems(order);
            if (!items.length) return `<p class="${lineClass} italic text-gray-400">Belum ada produk</p>`;
            return items.map(it => `<p class="${lineClass}">${it.quantity}x ${it.productName ? escapeHTML(it.productName) : '<span class="italic text-gray-400">Menu telah dihapus</span>'}</p>`).join('');
        }
        function getOrderUnitInfo(order) {
            const t = getOrderTotals(order);
            if (t.items.length === 1) return t.items[0].unitPrice === null ? '' : '@ ' + formatIDR(t.items[0].unitPrice);
            return t.items.length ? `${t.items.length} produk · ${t.totalQty} pcs` : '';
        }
        function formatOrderTotal(order) {
            const total = getOrderTotals(order).total;
            return total === null ? '-' : formatIDR(total);
        }

        // Migrasi aman booking lama -> items (data lama disimpan sebagai legacyMenuId/legacyQty, tidak dihapus)
        function migrateLegacyBookings() {
            let migrated = 0;
            bookings.forEach(b => {
                if (Array.isArray(b.items)) return;
                if (b.menuId === undefined || b.menuId === null) return;
                const menu = menuItems.find(m => m.id == b.menuId);
                if (!menu) return; // produk sudah tidak ada: tetap tampil via kompatibilitas
                b.items = [buildOrderItem({ productId: menu.id, productName: menu.name, category: menu.category, quantity: b.qty, unitPrice: menu.price, unitHpp: menu.hpp })];
                b.legacyMenuId = b.menuId;
                b.legacyQty = b.qty;
                delete b.menuId;
                delete b.qty;
                migrated++;
            });
            return migrated;
        }
        migrateLegacyBookings();

        // --- Status pesanan (satu sumber kebenaran) ---
        const ORDER_STATUS = Object.freeze({
            PENDING: 'Pending',
            PROSES: 'Proses',
            SELESAI: 'Selesai',
            BATAL: 'Batal'
        });
        // Variasi huruf / istilah dari data dipetakan ke status baku
        const ORDER_STATUS_ALIASES = {
            'pending': ORDER_STATUS.PENDING, 'menunggu': ORDER_STATUS.PENDING,
            'proses': ORDER_STATUS.PROSES, 'diproses': ORDER_STATUS.PROSES, 'processing': ORDER_STATUS.PROSES, 'in progress': ORDER_STATUS.PROSES,
            'selesai': ORDER_STATUS.SELESAI, 'done': ORDER_STATUS.SELESAI, 'complete': ORDER_STATUS.SELESAI, 'completed': ORDER_STATUS.SELESAI,
            'batal': ORDER_STATUS.BATAL, 'dibatalkan': ORDER_STATUS.BATAL, 'cancel': ORDER_STATUS.BATAL, 'canceled': ORDER_STATUS.BATAL, 'cancelled': ORDER_STATUS.BATAL
        };
        function normalizeStatus(value) {
            const key = String(value ?? '').trim().toLowerCase().replace(/\s+/g, ' ');
            return ORDER_STATUS_ALIASES[key] || null; // null = status tidak dikenal
        }
        function getStatusLabel(value) {
            return normalizeStatus(value) || String(value ?? '').trim() || '-';
        }
        // Pesanan aktif tampil di Home & daftar utama Booking.
        // Pesanan Selesai/Batal tetap tersimpan di data dan tampil di Riwayat Pesanan (arsip).
        const ACTIVE_STATUSES = [ORDER_STATUS.PENDING, ORDER_STATUS.PROSES];
        function isActiveOrder(order) {
            return ACTIVE_STATUSES.includes(normalizeStatus(order.status));
        }
        function isCancelledOrder(order) {
            return normalizeStatus(order.status) === ORDER_STATUS.BATAL;
        }

        // Konfigurasi aksi pada kartu pesanan per halaman.

            history: Object.freeze({ invoice: true, edit: true, delete: false })
        });

        // Format Currency Helper
        function formatIDR(amount) {
            if (privacyMode) return 'Rp ••••••';
            return 'Rp ' + Number(amount).toLocaleString('id-ID');
        }

        // Toggle Privacy Mask
        function togglePrivacy() {

        function showToast(msg, isError = false) {

        // Tab Switcher
        function switchTab(tabName) {

        function renderCurrentTab() {

            `;

            daysList.forEach(day => {
                const dayOrders = bookings.filter(b => b.date === day.dateStr && isActiveOrder(b));
                const isSelected = (day.dateStr === selectedDateFilter);
                
                html += `

                        <p class="text-[10px] font-semibold uppercase ${isSelected ? 'text-bakery-100' : 'text-gray-500'}">${day.dayName}</p>
                        <p class="text-base font-extrabold my-0.5 ${isSelected ? 'text-white' : 'text-gray-900'}">${day.dayNum}</p>

                            <span class="px-1.5 py-0.5 rounded-full text-[9px] font-bold ${dayOrders.length > 0 ? (isSelected ? 'bg-white text-bakery-700' : 'bg-bakery-100 text-bakery-700') : 'bg-gray-200 text-gray-500'}">${dayOrders.length} ord</span>
                        </div>

                `;
            });

            html += `
                        </div>
                    </div>

                    <!-- Vertical Chronological Timeline for Selected Date -->
                    <div class="space-y-3">

                            <h3 class="text-xs font-bold text-gray-700 uppercase tracking-wide">

                            </h3>
                            <button onclick="resetHomeDate()" class="text-xs text-bakery-600 font-bold hover:underline">Hari Ini</button>
                        </div>
            `;

            const filteredBookings = bookings.filter(b => b.date === selectedDateFilter && isActiveOrder(b)).sort((a,b) => a.time.localeCompare(b.time));

            if (filteredBookings.length === 0) {
                html += `
                    <div class="bg-white rounded-3xl p-8 text-center border border-gray-100 shadow-sm">

        let selectedDateFilter = todayStr;

        // --- Posisi scroll horizontal kalender ---
        // Home dirender ulang via innerHTML sehingga elemen kalender dibuat baru (scrollLeft kembali 0).
        // Posisi terakhir disimpan di sini dan dipulihkan setelah setiap render.
        let homeCalendarScrollLeft = 0;       // posisi awal = 0 (hari ini di paling kiri)
        let homeCalendarRevealSelected = false; // true hanya saat pengguna mengganti tanggal terpilih

        function restoreHomeCalendarScroll() {
            const scroller = document.getElementById('home-calendar-scroll');
            if (!scroller) return;
            scroller.scrollLeft = homeCalendarScrollLeft;

            // Auto-scroll hanya jika tanggal terpilih baru berubah DAN berada di luar area terlihat
            if (homeCalendarRevealSelected) {
                const active = scroller.querySelector(`[data-date="${selectedDateFilter}"]`);
                if (active) {
                    const box = scroller.getBoundingClientRect();
                    const card = active.getBoundingClientRect();
                    if (card.left < box.left) scroller.scrollLeft -= (box.left - card.left);
                    else if (card.right > box.right) scroller.scrollLeft += (card.right - box.right);
                }
                homeCalendarRevealSelected = false;
            }
            homeCalendarScrollLeft = scroller.scrollLeft;
            // Simpan setiap geseran manual pengguna
            scroller.addEventListener('scroll', () => { homeCalendarScrollLeft = scroller.scrollLeft; }, { passive: true });
        }

        function filterHomeDate(dateStr) {
            if (dateStr !== selectedDateFilter) homeCalendarRevealSelected = true;
            selectedDateFilter = dateStr;

        function resetHomeDate() {
            if (selectedDateFilter !== todayStr) homeCalendarRevealSelected = true;
            selectedDateFilter = todayStr;
            renderCurrentTab();
        }
        function formatDisplayDate(dateStr) {
            const parts = dateStr.split('-');
            const d = new Date(parts[0], parts[1] - 1, parts[2]);
            return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
        }


        // --- 2. BOOKING TAB (Daftar pesanan aktif + Riwayat Pesanan) ---
        let bookingSearchQuery = '';
        let bookingStatusFilter = 'ALL';
        let bookingView = 'active';   // 'active' | 'history'
        const ACTIVE_STATUS_FILTERS = ['ALL', ...ACTIVE_STATUSES];

        function getStatusBadgeClass(status) {
            const st = normalizeStatus(status);
            if (st === ORDER_STATUS.PENDING) return 'bg-amber-100 text-amber-800 border-amber-200';
            if (st === ORDER_STATUS.PROSES) return 'bg-blue-100 text-blue-800 border-blue-200';
            if (st === ORDER_STATUS.SELESAI) return 'bg-emerald-100 text-emerald-800 border-emerald-200';
            if (st === ORDER_STATUS.BATAL) return 'bg-red-100 text-red-800 border-red-200';
            return 'bg-gray-100 text-gray-700 border-gray-200'; // status tidak dikenal
        }

        function orderMatchesSearch(order, query) {
            const q = String(query || '').trim().toLowerCase();
            if (!q) return true;
            return String(order.customer || '').toLowerCase().includes(q) ||
                getOrderItems(order).some(it => String(it.productName || '').toLowerCase().includes(q));
        }

        // Kartu pesanan daftar Booking. options: { invoice, edit, delete } (default semua tampil)
        function renderBookingCardHTML(order, options = {}) {
            const actions = { invoice: true, edit: true, delete: true, ...options };
            const statusBadge = getStatusBadgeClass(order.status);
            return `
                        <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 space-y-3 relative hover:border-bakery-300 transition">
                            <div class="flex items-center justify-between border-b border-gray-100 pb-2.5">

                                    <span class="text-xs font-bold text-bakery-700 bg-bakery-50 px-2.5 py-1 rounded-xl">

                                    <option value="${ORDER_STATUS.PROSES}" ${normalizeStatus(order.status) === ORDER_STATUS.PROSES ? 'selected' : ''}>Proses</option>
                                    <option value="${ORDER_STATUS.SELESAI}" ${normalizeStatus(order.status) === ORDER_STATUS.SELESAI ? 'selected' : ''}>Selesai</option>
                                    <option value="${ORDER_STATUS.BATAL}" ${normalizeStatus(order.status) === ORDER_STATUS.BATAL ? 'selected' : ''}>Batal</option>
                                </select>
                            </div>
                            <div class="flex justify-between items-start">
                                <div>
                                    <h4 class="font-bold text-gray-900 text-sm">${order.customer}</h4>
                                    ${renderOrderItemsSummaryHTML(order, 'text-xs font-semibold text-gray-700 mt-0.5')}
                                    ${order.notes ? `<p class="text-[11px] text-gray-500 italic mt-1"><i class="fa-solid fa-note-sticky mr-1 text-bakery-400"></i> ${order.notes}</p>` : ''}
                                </div>
                                <div class="text-right">
                                    <p class="text-xs font-extrabold text-bakery-900">${formatOrderTotal(order)}</p>
                                    <p class="text-[10px] text-gray-400 mt-0.5">${getOrderUnitInfo(order)}</p>
                                </div>
                            </div>
                            <div class="flex items-center justify-end space-x-2 pt-1 border-t border-gray-50">
                                ${actions.invoice ? `<button type="button" onclick="event.stopPropagation(); openInvoicePreview(${order.id})" class="px-3 py-1 bg-gray-100 hover:bg-bakery-100 text-gray-700 hover:text-bakery-700 rounded-xl text-xs font-semibold transition flex items-center space-x-1" title="Cetak Invoice" aria-label="Cetak Invoice">
                                    <i class="fa-solid fa-print text-[10px]"></i><span>Invoice</span>
                                </button>` : ''}
                                ${actions.edit ? `<button onclick="editBooking(${order.id})" class="px-3 py-1 bg-gray-100 hover:bg-bakery-100 text-gray-700 hover:text-bakery-700 rounded-xl text-xs font-semibold transition flex items-center space-x-1">
                                    <i class="fa-solid fa-pen text-[10px]"></i><span>Edit</span>
                                </button>` : ''}
                                ${actions.delete ? `<button onclick="deleteBooking(${order.id})" class="px-3 py-1 bg-red-50 hover:bg-red-100 text-red-600 rounded-xl text-xs font-semibold transition flex items-center space-x-1">
                                    <i class="fa-solid fa-trash text-[10px]"></i><span>Hapus</span>
                                </button>` : ''}
                            </div>
                        </div>
            `;
        }

        function renderBookingTab(container) {
            if (bookingView === 'history') {
                renderOrderHistory(container);
                return;
            }
            if (!ACTIVE_STATUS_FILTERS.includes(bookingStatusFilter)) bookingStatusFilter = 'ALL';

            let html = `
                <div class="p-4 space-y-4">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-3 min-w-0">
                            <div class="w-10 h-10 shrink-0 rounded-2xl bg-gradient-to-br from-bakery-400 to-bakery-700 text-white flex items-center justify-center shadow-md shadow-bakery-500/30 ring-4 ring-bakery-100">
                                <i class="fa-solid fa-calendar-check text-base"></i>
                            </div>
                            <h2 class="text-lg font-extrabold text-gray-900 tracking-tight">Kelola Booking</h2>
                        </div>
                        <button onclick="openQuickBookingModal()" class="px-3.5 py-2 bg-bakery-600 text-white rounded-xl text-xs font-bold shadow hover:bg-bakery-700 transition flex items-center space-x-1.5">
                            <i class="fa-solid fa-plus"></i>
                            <span>Tambah Booking</span>
                        </button>
                    </div>

                    <!-- Search & Filter Controls -->
                    <div class="space-y-2.5">
                        <div class="relative">
                            <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-gray-400 text-sm"></i>
                            <input type="text" id="booking-search-input" value="${escapeHTML(bookingSearchQuery)}" oninput="handleBookingSearch(this.value)" placeholder="Cari nama pemesan atau menu roti..." class="w-full bg-white border border-gray-200 rounded-2xl pl-10 pr-4 py-2.5 text-xs text-gray-800 focus:outline-none focus:border-bakery-500 font-medium shadow-sm">
                        </div>
                        <div class="flex space-x-1.5 overflow-x-auto hide-scrollbar pb-1">
            `;

            ACTIVE_STATUS_FILTERS.forEach(st => {
                const isActive = bookingStatusFilter === st;
                const label = st === 'ALL' ? 'Semua Status' : st;
                html += `
                    <button onclick="filterBookingStatus('${st}')" class="px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition border ${isActive ? 'bg-bakery-600 text-white border-bakery-600 shadow' : 'bg-white text-gray-600 border-gray-200 hover:bg-bakery-50'}">
                        ${label}
                    </button>
                `;
            });

            html += `
                        </div>
                        <!-- Tombol Riwayat Pesanan -->
                        <button onclick="openOrderHistory()" class="w-full bg-white border border-gray-200 hover:border-bakery-300 hover:bg-bakery-50/60 rounded-2xl px-3.5 py-3 shadow-sm flex items-center justify-between transition text-left">
                            <span class="flex items-center space-x-3 min-w-0">
                                <span class="w-9 h-9 shrink-0 rounded-xl bg-bakery-50 text-bakery-600 flex items-center justify-center"><i class="fa-solid fa-clock-rotate-left text-sm"></i></span>
                                <span class="min-w-0">
                                    <span class="block text-xs font-bold text-gray-900">Riwayat Pesanan</span>
                                    <span class="block text-[10px] text-gray-500 truncate">Semua pesanan per bulan, termasuk Selesai &amp; Batal</span>
                                </span>
                            </span>
                            <i class="fa-solid fa-chevron-right text-gray-400 text-xs ml-2"></i>
                        </button>
                    </div>

                    <!-- Booking List (hanya pesanan aktif) -->
                    <div id="booking-list" class="space-y-3">${getActiveBookingListHTML()}</div>
                </div>
            `;
            container.innerHTML = html;
        }

        function getActiveBookingListHTML() {
            const filtered = bookings.filter(b =>
                isActiveOrder(b) &&
                orderMatchesSearch(b, bookingSearchQuery) &&
                (bookingStatusFilter === 'ALL' || normalizeStatus(b.status) === bookingStatusFilter)
            ).sort((a,b) => b.date.localeCompare(a.date));

            if (filtered.length === 0) {
                const hasQuery = bookingSearchQuery.trim() !== '' || bookingStatusFilter !== 'ALL';
                return `
                    <div class="bg-white rounded-3xl p-8 text-center border border-gray-100 shadow-sm">
                        <i class="fa-solid fa-folder-open text-gray-300 text-3xl mb-2"></i>
                        <p class="text-sm font-bold text-gray-800">${hasQuery ? 'Tidak ada pesanan ditemukan' : 'Tidak ada pesanan aktif'}</p>
                        <p class="text-xs text-gray-400 mt-1">${hasQuery ? 'Coba ubah kata kunci pencarian atau filter status.' : 'Pesanan Selesai dan Batal dapat dilihat di Riwayat Pesanan.'}</p>
                    </div>
                `;
            }
            return filtered.map(order => renderBookingCardHTML(order, ORDER_CARD_ACTIONS.booking)).join('');
        }

        function handleBookingSearch(val) {
            bookingSearchQuery = val;
            const list = document.getElementById('booking-list');
            if (list) list.innerHTML = getActiveBookingListHTML();
        }

        function filterBookingStatus(st) {
            bookingStatusFilter = st;
            renderCurrentTab();
        }

        function updateOrderStatus(id, newStatus) {
            const order = bookings.find(b => b.id === id);
            if (order) {
                order.status = normalizeStatus(newStatus) || newStatus;
                const movedToHistory = !isActiveOrder(order) && bookingView === 'active';
                showToast(movedToHistory ? `Pesanan ${getStatusLabel(order.status)} dipindahkan ke Riwayat` : `Status pesanan diperbarui jadi ${getStatusLabel(order.status)}`);
                renderCurrentTab();
            }
        }

        // --- RIWAYAT PESANAN (sumber data yang sama: array bookings) ---
        let historyMonth = '';          // 'YYYY-MM' (jadwal booking)
        let historySearchQuery = '';

        function getCurrentMonthStr() {
            return formatDateStr(new Date()).slice(0, 7); // pakai tanggal lokal, bukan UTC
        }

        function openOrderHistory() {
            bookingView = 'history';
            historyMonth = getCurrentMonthStr();
            historySearchQuery = '';
            renderCurrentTab();
            updateOrderHistory({ showLoading: true });
            document.getElementById('main-content').scrollTop = 0;
        }

        function closeOrderHistory() {
            bookingView = 'active';
            renderCurrentTab();
            document.getElementById('main-content').scrollTop = 0;
        }

        function shiftHistoryMonth(delta) {
            let [y, m] = historyMonth.split('-').map(Number);
            m += delta;
            while (m > 12) { m -= 12; y++; }
            while (m < 1) { m += 12; y--; }
            historyMonth = `${y}-${String(m).padStart(2, '0')}`;
            updateOrderHistory({ showLoading: true });
        }

        function setHistoryMonth(val) {
            if (!/^\d{4}-(0[1-9]|1[0-2])$/.test(val)) return;
            historyMonth = val;
            updateOrderHistory({ showLoading: true });
        }

        function handleHistorySearch(val) {
            historySearchQuery = val;
            updateOrderHistory();
        }

        function getHistoryOrders() {
            return bookings
                .filter(b => String(b.date || '').startsWith(historyMonth + '-') && orderMatchesSearch(b, historySearchQuery))
                .sort((a, b) => b.date.localeCompare(a.date) || String(b.time || '').localeCompare(String(a.time || '')));
        }

        function getHistoryListHTML() {
            const orders = getHistoryOrders();
            if (orders.length === 0) {
                const searching = historySearchQuery.trim() !== '';
                return `
                    <div class="bg-white rounded-3xl p-8 text-center border border-gray-100 shadow-sm">
                        <div class="w-12 h-12 bg-bakery-50 rounded-full flex items-center justify-center mx-auto mb-3 text-bakery-500">
                            <i class="fa-solid fa-${searching ? 'magnifying-glass' : 'box-open'} text-xl"></i>
                        </div>
                        <p class="text-sm font-bold text-gray-800">${searching ? 'Tidak ada pesanan yang cocok' : 'Belum ada riwayat pesanan pada bulan ini.'}</p>
                        <p class="text-xs text-gray-400 mt-1">${searching ? `Tidak ditemukan pesanan untuk "${escapeHTML(historySearchQuery.trim())}" di ${formatDisplayMonth(historyMonth)}.` : 'Coba pilih bulan lain.'}</p>
                    </div>
                `;
            }
            const count = (st) => orders.filter(o => normalizeStatus(o.status) === st).length;
            const unknown = orders.filter(o => !normalizeStatus(o.status)).length;
            const chips = [[ORDER_STATUS.SELESAI, 'bg-emerald-50 text-emerald-700'], [ORDER_STATUS.PENDING, 'bg-amber-50 text-amber-700'], [ORDER_STATUS.PROSES, 'bg-blue-50 text-blue-700'], [ORDER_STATUS.BATAL, 'bg-red-50 text-red-700']]
                .filter(([st]) => count(st) > 0)
                .map(([st, cls]) => `<span class="px-2 py-0.5 rounded-full font-bold ${cls}">${count(st)} ${st}</span>`).join('')
                + (unknown ? `<span class="px-2 py-0.5 rounded-full font-bold bg-gray-100 text-gray-600">${unknown} Lainnya</span>` : '');
            return `
                <div class="flex items-center justify-between gap-2 px-1">
                    <p class="text-xs font-bold text-gray-700 shrink-0">${orders.length} pesanan</p>
                    <div class="flex flex-wrap justify-end gap-1 text-[10px]">${chips}</div>
                </div>
                ${orders.map(renderHistoryCardHTML).join('')}
            `;
        }

        // Kartu Riwayat. Pesanan Selesai/Batal = arsip (hanya baca + invoice).
        // Pesanan yang masih aktif di bulan tsb tetap bisa dikelola seperti di daftar Booking.
        function renderHistoryCardHTML(order) {
            const archived = !isActiveOrder(order);
            const statusBadge = getStatusBadgeClass(order.status);
            const dateLabel = order.date ? formatDisplayDate(order.date) : '-';
            const timeLabel = order.time ? `${escapeHTML(order.time)} WIB` : '';

            const statusControl = archived
                ? `<span class="text-xs font-bold px-2.5 py-1 rounded-full border ${statusBadge}">${escapeHTML(getStatusLabel(order.status))}</span>`
                : `<select onchange="updateOrderStatus(${order.id}, this.value)" class="text-xs font-bold px-2.5 py-1 rounded-full border ${statusBadge} focus:outline-none cursor-pointer" aria-label="Ubah status pesanan">
                        ${Object.values(ORDER_STATUS).map(st => `<option value="${st}" ${normalizeStatus(order.status) === st ? 'selected' : ''}>${st}</option>`).join('')}
                   </select>`;

            return `
                <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 space-y-3 relative hover:border-bakery-300 transition">
                    <div class="flex items-center justify-between gap-2 border-b border-gray-100 pb-2.5">
                        <span class="text-xs font-bold text-bakery-700 bg-bakery-50 px-2.5 py-1 rounded-xl min-w-0 truncate">
                            <i class="fa-regular fa-calendar mr-1"></i> ${dateLabel}${timeLabel ? ` &middot; ${timeLabel}` : ''}
                        </span>
                        <div class="shrink-0">${statusControl}</div>
                    </div>
                    <div class="flex justify-between items-start gap-3">
                        <div class="min-w-0">
                            <h4 class="font-bold text-gray-900 text-sm break-words">${escapeHTML(order.customer || '-')}</h4>
                            ${renderOrderItemsSummaryHTML(order, 'text-xs font-semibold text-gray-700 mt-0.5 break-words')}
                            ${order.notes ? `<p class="text-[11px] text-gray-500 italic mt-1 break-words"><i class="fa-solid fa-note-sticky mr-1 text-bakery-400"></i> ${escapeHTML(order.notes)}</p>` : ''}
                        </div>
                        <div class="text-right shrink-0">
                            <p class="text-xs font-extrabold text-bakery-900">${formatOrderTotal(order)}</p>
                            <p class="text-[10px] text-gray-400 mt-0.5">${getOrderUnitInfo(order)}</p>
                        </div>
                    </div>
                    <div class="flex items-center justify-between space-x-2 pt-1 border-t border-gray-50">
                        <span class="text-[10px] text-gray-400 font-medium">${archived ? '<i class="fa-solid fa-box-archive mr-1"></i> Arsip' : '<i class="fa-solid fa-circle-play mr-1"></i> Masih aktif'}</span>
                        <div class="flex items-center space-x-2">
                            <button onclick="openInvoicePreview(${order.id})" class="px-3 py-1 bg-gray-100 hover:bg-bakery-100 text-gray-700 hover:text-bakery-700 rounded-xl text-xs font-semibold transition flex items-center space-x-1" title="Cetak Invoice" aria-label="Cetak Invoice">
                                <i class="fa-solid fa-print text-[10px]"></i><span>Invoice</span>
                            </button>
                            ${archived || !ORDER_CARD_ACTIONS.history.edit ? '' : `
                            <button onclick="editBooking(${order.id})" class="px-3 py-1 bg-gray-100 hover:bg-bakery-100 text-gray-700 hover:text-bakery-700 rounded-xl text-xs font-semibold transition flex items-center space-x-1">
                                <i class="fa-solid fa-pen text-[10px]"></i><span>Edit</span>
                            </button>`}${archived || !ORDER_CARD_ACTIONS.history.delete ? '' : `
                            <button onclick="deleteBooking(${order.id})" class="px-3 py-1 bg-red-50 hover:bg-red-100 text-red-600 rounded-xl text-xs font-semibold transition flex items-center space-x-1">
                                <i class="fa-solid fa-trash text-[10px]"></i><span>Hapus</span>
                            </button>`}
                        </div>
                    </div>
                </div>
            `;
        }

        function getHistoryLoadingHTML() {
            return `
                <div class="bg-white rounded-3xl p-8 text-center border border-gray-100 shadow-sm" aria-live="polite">
                    <div class="w-9 h-9 border-4 border-bakery-100 border-t-bakery-600 rounded-full animate-spin mx-auto"></div>
                    <p class="text-xs font-bold text-gray-700 mt-3">Memuat riwayat pesanan...</p>
                </div>
            `;
        }

        function getHistoryErrorHTML(err) {
            return `
                <div class="bg-white rounded-3xl p-8 text-center border border-red-100 shadow-sm" role="alert">
                    <div class="w-12 h-12 bg-red-50 rounded-full flex items-center justify-center mx-auto mb-3 text-red-500">
                        <i class="fa-solid fa-triangle-exclamation text-xl"></i>
                    </div>
                    <p class="text-sm font-bold text-gray-800">Gagal memuat riwayat pesanan</p>
                    <p class="text-xs text-gray-400 mt-1">${escapeHTML(err && err.message ? err.message : 'Terjadi kesalahan tidak dikenal.')}</p>
                    <button onclick="updateOrderHistory({ showLoading: true })" class="mt-4 px-4 py-2 bg-bakery-600 text-white rounded-xl text-xs font-bold shadow hover:bg-bakery-700 transition">
                        Coba Lagi
                    </button>
                </div>
            `;
        }

        function getSafeHistoryListHTML() {
            try {
                return getHistoryListHTML();
            } catch (err) {
                console.error(err);
                return getHistoryErrorHTML(err);
            }
        }

        // Perbarui label bulan + daftar tanpa me-render ulang input pencarian (fokus tidak hilang).
        // showLoading: tampilkan indikator saat ganti bulan / buka riwayat.
        let historyRenderToken = 0;
        function updateOrderHistory(opts = {}) {
            const label = document.getElementById('history-month-label');
            const input = document.getElementById('history-month-input');
            const list = document.getElementById('history-list');
            if (label) label.innerText = formatDisplayMonth(historyMonth);
            if (input) input.value = historyMonth;
            if (!list) return;
            const token = ++historyRenderToken;
            if (!opts.showLoading) { list.innerHTML = getSafeHistoryListHTML(); return; }
            list.innerHTML = getHistoryLoadingHTML();
            setTimeout(() => {
                if (token !== historyRenderToken) return; // ada permintaan yang lebih baru
                const current = document.getElementById('history-list');
                if (current) current.innerHTML = getSafeHistoryListHTML();
            }, 150);
        }

        function renderOrderHistory(container) {
            if (!historyMonth) historyMonth = getCurrentMonthStr();
            container.innerHTML = `
                <div class="p-4 space-y-4">
                    <div class="flex items-center justify-between gap-2">
                        <div class="flex items-center gap-3 min-w-0">
                            <div class="w-10 h-10 shrink-0 rounded-2xl bg-gradient-to-br from-bakery-400 to-bakery-700 text-white flex items-center justify-center shadow-md shadow-bakery-500/30 ring-4 ring-bakery-100">
                                <i class="fa-solid fa-clock-rotate-left text-base"></i>
                            </div>
                            <h2 class="text-lg font-extrabold text-gray-900 tracking-tight">Riwayat Pesanan</h2>
                        </div>
                        <button onclick="closeOrderHistory()" class="px-3.5 py-2 shrink-0 bg-white border border-gray-200 text-gray-700 rounded-xl text-xs font-bold shadow-sm hover:bg-bakery-50 hover:text-bakery-700 transition flex items-center space-x-1.5" aria-label="Kembali ke Kelola Booking">
                            <i class="fa-solid fa-arrow-left"></i>
                            <span>Kembali</span>
                        </button>
                    </div>

                    <div class="space-y-2.5">
                        <!-- Filter Bulan -->
                        <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-1.5 flex items-center justify-between">
                            <button onclick="shiftHistoryMonth(-1)" class="w-9 h-9 shrink-0 rounded-xl hover:bg-bakery-50 text-gray-600 hover:text-bakery-700 flex items-center justify-center transition" aria-label="Bulan sebelumnya">
                                <i class="fa-solid fa-chevron-left text-xs"></i>
                            </button>
                            <label class="relative flex-1 flex items-center justify-center cursor-pointer py-1.5 rounded-xl hover:bg-bakery-50/60 transition">
                                <i class="fa-regular fa-calendar text-bakery-500 mr-2 text-sm"></i>
                                <span id="history-month-label" class="text-sm font-extrabold text-gray-900">${formatDisplayMonth(historyMonth)}</span>
                                <input type="month" id="history-month-input" value="${historyMonth}" onchange="setHistoryMonth(this.value)" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" aria-label="Pilih bulan riwayat">
                            </label>
                            <button onclick="shiftHistoryMonth(1)" class="w-9 h-9 shrink-0 rounded-xl hover:bg-bakery-50 text-gray-600 hover:text-bakery-700 flex items-center justify-center transition" aria-label="Bulan berikutnya">
                                <i class="fa-solid fa-chevron-right text-xs"></i>
                            </button>
                        </div>
                        <!-- Pencarian -->
                        <div class="relative">
                            <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-gray-400 text-sm"></i>
                            <input type="text" id="history-search-input" value="${escapeHTML(historySearchQuery)}" oninput="handleHistorySearch(this.value)" placeholder="Cari nama pemesan atau menu roti..." class="w-full bg-white border border-gray-200 rounded-2xl pl-10 pr-4 py-2.5 text-xs text-gray-800 focus:outline-none focus:border-bakery-500 font-medium shadow-sm">
                        </div>
                    </div>

                    <div id="history-list" class="space-y-3">${getSafeHistoryListHTML()}</div>
                </div>
            `;
        }


        // --- 3. PROFIT & LOSS TAB (Defaults to Current Month "Bulan Ini" + Privacy Mask) ---
        let selectedPnlMonth = new Date().toISOString().slice(0, 7); // 'YYYY-MM'

        function renderPnlTab(container) {
            // Filter bookings for selected month
            let monthBookings = bookings.filter(b => b.date.startsWith(selectedPnlMonth) && !isCancelledOrder(b));

            let grossRevenue = 0;
            let totalHpp = 0;
            let totalItemsSold = 0;

            // Dihitung per item pesanan (harga & HPP snapshot saat booking)
            monthBookings.forEach(b => {
                getOrderItems(b).forEach(it => {
                    grossRevenue += it.subtotal || 0;
                    totalHpp += it.subtotalHpp || 0;
                    totalItemsSold += it.quantity;
                });
            });

            // Rumus P&L:
            // Biaya Operasional Est. = Total Pendapatan × 10%
            // Laba Bersih            = Total Pendapatan − Total HPP − Biaya Operasional Est.
            // Margin Laba Bersih     = (Laba Bersih ÷ Total Pendapatan) × 100%
            const OPERATIONAL_EXPENSE_RATE = 0.10;
            const operationalExpense = Math.round(grossRevenue * OPERATIONAL_EXPENSE_RATE);
            const netProfit = grossRevenue - totalHpp - operationalExpense;
            const profitMargin = grossRevenue > 0 ? ((netProfit / grossRevenue) * 100).toFixed(1) : 0;

            let html = `
                <div class="p-4 space-y-4">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-3 min-w-0">
                            <div class="w-10 h-10 shrink-0 rounded-2xl bg-gradient-to-br from-emerald-400 to-emerald-700 text-white flex items-center justify-center shadow-md shadow-emerald-500/30 ring-4 ring-emerald-100">
                                <i class="fa-solid fa-chart-line text-base"></i>
                            </div>
                            <div class="min-w-0">
                                <h2 class="text-lg font-extrabold text-gray-900 tracking-tight">Laba & Rugi (P&L)</h2>
                            </div>
                        </div>
                        <input type="month" id="pnl-month-select" value="${selectedPnlMonth}" onchange="changePnlMonth(this.value)" class="bg-white border border-gray-200 text-xs font-bold text-gray-800 px-3 py-2 rounded-xl focus:outline-none focus:border-bakery-500 shadow-sm">
                    </div>

                    <!-- Main Summary Card -->
                    <div class="bg-gradient-to-br from-gray-900 via-bakery-950 to-bakery-900 text-white rounded-3xl p-6 shadow-xl relative overflow-hidden">
                        <div class="absolute right-0 top-0 w-40 h-40 bg-bakery-500/10 rounded-full blur-2xl pointer-events-none"></div>
                        <div class="flex justify-between items-center mb-4">
                            <span class="text-xs font-semibold text-bakery-200 tracking-wide uppercase">Net Profit (Laba Bersih)</span>
                            <span class="bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 px-2.5 py-0.5 rounded-full text-[11px] font-bold">
                                Margin ${profitMargin}%
                            </span>
                        </div>
                        <h3 class="text-3xl font-extrabold tracking-tight mb-2">${formatIDR(netProfit)}</h3>
                        <p class="text-xs text-gray-300">Periode: <span class="font-bold text-white">${formatDisplayMonth(selectedPnlMonth)}</span></p>

                        <div class="grid grid-cols-2 gap-3 mt-6 pt-5 border-t border-white/10">
                            <div>
                                <p class="text-[11px] text-gray-400">Total Omset Kotor</p>
                                <p class="text-sm font-bold text-emerald-400 mt-0.5">${formatIDR(grossRevenue)}</p>
                            </div>
                            <div class="text-right">
                                <p class="text-[11px] text-gray-400">Total Produk Terjual</p>

        function findModalSelection(productId) {

        }

        function showOrderItemsError(msg) {
            const el = document.getElementById('order-items-error');
            el.innerText = msg;
            el.classList.remove('hidden');
            document.getElementById('modal-menu-items').scrollIntoView({ block: 'nearest' });
        }
        function hideOrderItemsError() {
            document.getElementById('order-items-error').classList.add('hidden');
        }

        // Pilih / batalkan produk (klik ulang = batal). Produk yang sama tidak pernah ditambahkan dua kali.
        function toggleModalProduct(productId) {
            const existing = findModalSelection(productId);
            if (existing) {
                modalSelectedItems = modalSelectedItems.filter(s => s !== existing);
            } else {
                const menu = menuItems.find(m => String(m.id) === String(productId));
                if (!menu) return;
                modalSelectedItems.push({
                    productId: menu.id, productName: menu.name, category: menu.category,
                    quantity: 1, unitPrice: Number(menu.price) || 0, unitHpp: Number(menu.hpp) || 0
                });
            }
            hideOrderItemsError();
            renderModalMenuItems();
        }

        function changeModalQty(productId, delta) {
            const sel = findModalSelection(productId);
            if (!sel) return;
            sel.quantity = Math.min(9999, Math.max(1, toValidQty(sel.quantity) + delta));
            renderModalMenuItems();
        }

        function setModalQty(productId, raw) {
            const sel = findModalSelection(productId);
            if (!sel) return;
            if (!isValidQtyInput(raw)) {
                showOrderItemsError(`Qty "${sel.productName || 'produk'}" harus bilangan bulat minimal 1.`);
                sel.quantity = toValidQty(raw);
            } else {
                hideOrderItemsError();
                sel.quantity = Math.min(9999, Number(raw));
            }
            renderModalMenuItems();
        }

        function renderModalProductRow(p, sel, unavailable) {
            const id = p.productId;
            const name = escapeHTML(p.productName || 'Produk tanpa nama');
            const price = toMoneyOrNull(p.unitPrice);
            const meta = unavailable
                ? '<span class="text-red-500">Menu telah dihapus</span>'
                : `${getCategoryLabel(p.category) || '-'}${sel ? ` &middot; @ ${formatIDR(price)}` : ''}`;
            const control = sel
                ? `<div class="flex items-center shrink-0 bg-white border border-bakery-200 rounded-lg overflow-hidden">
                        <button type="button" onclick="changeModalQty(${id}, -1)" ${sel.quantity <= 1 ? 'disabled' : ''} class="w-7 h-7 flex items-center justify-center text-bakery-700 hover:bg-bakery-50 disabled:text-gray-300 disabled:cursor-not-allowed transition" aria-label="Kurangi jumlah ${name}"><i class="fa-solid fa-minus text-[10px]"></i></button>
                        <input type="number" inputmode="numeric" min="1" step="1" value="${sel.quantity}" onchange="setModalQty(${id}, this.value)" class="w-9 h-7 text-center text-xs font-bold text-gray-900 border-x border-bakery-100 focus:outline-none" aria-label="Jumlah ${name}">
                        <button type="button" onclick="changeModalQty(${id}, 1)" class="w-7 h-7 flex items-center justify-center text-bakery-700 hover:bg-bakery-50 transition" aria-label="Tambah jumlah ${name}"><i class="fa-solid fa-plus text-[10px]"></i></button>
                   </div>`
                : `<span class="text-xs font-extrabold text-bakery-800 shrink-0">${formatIDR(price)}</span>`;
            return `
                <div class="flex items-center justify-between gap-2 p-2 rounded-xl transition border ${sel ? 'bg-bakery-50 border-bakery-300' : 'bg-white border-gray-100 hover:bg-gray-50'}">
                    <label class="flex items-center space-x-2.5 flex-1 min-w-0 cursor-pointer">
                        <input type="checkbox" value="${id}" ${sel ? 'checked' : ''} onchange="toggleModalProduct(${id})" class="w-4 h-4 shrink-0 rounded text-bakery-600 focus:ring-bakery-500 accent-orange-600" aria-label="Pilih ${name}">
                        <div class="min-w-0">
                            <p class="text-xs font-bold text-gray-900 truncate">${name}</p>
                            <p class="text-[10px] text-gray-400 truncate">${meta}</p>
                        </div>
                    </label>
                    ${control}
                </div>
            `;
        }

        function renderModalMenuItems() {
            const container = document.getElementById('modal-menu-items');
            const scrollTop = container.scrollTop;
            let html = '';
            // Produk pada pesanan lama yang sudah tidak ada di menu tetap ditampilkan agar bisa diedit/dihapus
            modalSelectedItems
                .filter(sel => !menuItems.some(m => String(m.id) === String(sel.productId)))
                .forEach(sel => { html += renderModalProductRow(sel, sel, true); });
            menuItems.forEach(m => {
                const sel = findModalSelection(m.id);
                // Produk yang sudah ada di pesanan memakai harga snapshot; produk baru memakai harga menu saat ini
                html += renderModalProductRow(sel ? sel : { productId: m.id, productName: m.name, category: m.category, unitPrice: m.price }, sel, false);
            });
            container.innerHTML = html;
            container.scrollTop = scrollTop;
            calculateModalTotal();
        }

        // Estimasi Total Tagihan & HPP dari seluruh produk terpilih
        function calculateModalTotal() {
            const items = mergeOrderItems(modalSelectedItems).map(buildOrderItem);
            const total = items.reduce((s, i) => s + (i.subtotal || 0), 0);
            const totalHpp = items.reduce((s, i) => s + (i.subtotalHpp || 0), 0);
            const totalQty = items.reduce((s, i) => s + i.quantity, 0);
            document.getElementById('modal-total-preview').innerText = formatIDR(total);
            document.getElementById('modal-hpp-preview').innerText = formatIDR(totalHpp);

            const count = document.getElementById('modal-selected-count');
            count.innerText = items.length ? `${items.length} produk · ${totalQty} pcs dipilih` : 'Belum ada produk dipilih';
            count.className = `text-[10px] font-bold text-right ${items.length ? 'text-bakery-700' : 'text-gray-400'}`;

            const breakdown = document.getElementById('modal-items-breakdown');
            breakdown.classList.toggle('hidden', items.length === 0);
            breakdown.innerHTML = items.map(i => `
                <div class="flex items-start justify-between gap-2 text-[11px]">
                    <span class="text-bakery-900 min-w-0 break-words">${i.quantity} &times; ${escapeHTML(i.productName || 'Menu telah dihapus')} <span class="text-gray-500">@ ${i.unitPrice === null ? '-' : formatIDR(i.unitPrice)}</span></span>
                    <span class="font-bold text-bakery-900 shrink-0">${i.subtotal === null ? '-' : formatIDR(i.subtotal)}</span>
                </div>`).join('');
        }

        function handleBookingSubmit(e) {
            e.preventDefault();
            const editId = document.getElementById('edit-booking-id').value;
            const customer = document.getElementById('order-customer').value;
            const date = document.getElementById('order-date').value;
            const time = document.getElementById('order-time').value;
            const status = document.getElementById('order-status').value;
            const notes = document.getElementById('order-notes').value;

            // --- Validasi item ---
            if (modalSelectedItems.length === 0) {
                showOrderItemsError('Pilih minimal satu produk sebelum menyimpan booking.');
                return;
            }
            const badQty = modalSelectedItems.find(i => !isValidQtyInput(i.quantity));
            if (badQty) {
                showOrderItemsError(`Qty "${badQty.productName || 'produk'}" harus bilangan bulat minimal 1.`);
                return;
            }
            const items = mergeOrderItems(modalSelectedItems).map(buildOrderItem);
            const unpriced = items.find(i => i.subtotal === null || i.subtotalHpp === null);
            if (unpriced) {
                showOrderItemsError(`Harga "${unpriced.productName || 'produk'}" tidak diketahui. Batalkan pilihan produk ini untuk melanjutkan.`);
                return;
            }
            hideOrderItemsError();

            if (editId) {
                const order = bookings.find(b => b.id == editId);
                if (order) {
                    order.customer = customer;
                    order.date = date;
                    order.time = time;
                    order.items = items;
                    if ('menuId' in order) { order.legacyMenuId = order.menuId; delete order.menuId; }
                    if ('qty' in order) { order.legacyQty = order.qty; delete order.qty; }
                    order.status = status;
                    order.notes = notes;
                    showToast('Booking berhasil diperbarui!');
                }
            } else {
                const newOrder = {
                    id: Date.now(),
                    customer,
                    date,
                    time,
                    items,
                    status,
                    notes
                };
                bookings.push(newOrder);
                showToast('Booking baru berhasil dibuat!');
            }

            closeBookingModal();
            renderCurrentTab();
        }

        function editBooking(id) {
            const order = bookings.find(b => b.id === id);
            if (!order) return;

            document.getElementById('modal-title').innerText = 'Edit Pesanan Booking';
            document.getElementById('edit-booking-id').value = order.id;
            document.getElementById('order-customer').value = order.customer;
            document.getElementById('order-date').value = order.date;
            document.getElementById('order-time').value = order.time;
            document.getElementById('order-status').value = normalizeStatus(order.status) || ORDER_STATUS.PENDING;
            document.getElementById('order-notes').value = order.notes || '';
            // Semua produk & qty sebelumnya otomatis terpilih (termasuk booking lama satu produk)
            modalSelectedItems = getOrderItems(order).map(it => ({
                productId: it.productId, productName: it.productName, category: it.category,
                quantity: it.quantity, unitPrice: it.unitPrice, unitHpp: it.unitHpp
            }));
            hideOrderItemsError();
            renderModalMenuItems();
            document.getElementById('booking-modal').classList.remove('hidden');

        function formatRupiah(amount) {
            return 'Rp ' + Math.round(Number(amount)).toLocaleString('id-ID');
        }

        function formatLongDate(dateStr) {
            const parts = String(dateStr || '').split('-').map(Number);
            if (parts.length !== 3 || parts.some(isNaN)) return null;
            const d = new Date(parts[0], parts[1] - 1, parts[2]);
            return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
        }

        function escapeHTML(str) {
            return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        function generateInvoiceNumber(order) {
            // Unik per pesanan: tanggal pesanan + ID pesanan (base36)
            const datePart = String(order.date || '').replace(/-/g, '') || '00000000';
            const idPart = Number(order.id).toString(36).toUpperCase().padStart(4, '0');
            return `DB-${datePart}-${idPart}`;
        }

        function buildInvoiceData(orderId) {
            const order = bookings.find(b => b.id === orderId);
            if (!order) throw new Error('Data pesanan tidak ditemukan. Pesanan mungkin sudah dihapus.');

            // Satu baris per produk (harga snapshot saat booking)
            const items = getOrderItems(order).map(it => {
                const menu = menuItems.find(m => String(m.id) === String(it.productId)) || null;
                return {
                    name: it.productName,
                    category: getCategoryLabel(it.category),
                    desc: menu ? (menu.desc || null) : null,
                    qty: it.quantity,
                    unitPrice: it.unitPrice,
                    subtotal: it.subtotal
                };
            });
            if (!items.length) throw new Error('Pesanan ini belum memiliki produk.');
            const allPriced = items.every(i => i.subtotal !== null);
            const total = allPriced ? items.reduce((s, i) => s + i.subtotal, 0) : null;

            const now = new Date();
            return {
                number: generateInvoiceNumber(order),
                invoiceDate: now.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }),
                printedAt: now.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }) + ' ' +
                           now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }).replace('.', ':'),
                orderId: order.id,
                orderDate: formatLongDate(order.date),
                orderTime: order.time ? `${order.time} WIB` : null,
                customer: (order.customer || '').trim() || null,
                status: order.status ? getStatusLabel(order.status) : null,
                notes: (order.notes || '').trim() || null,
                items: items,
                total: total
            };
        }
