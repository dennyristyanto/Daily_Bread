<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Bread Bakery App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bakery: {
                            50: '#fff7ed',
                            100: '#ffedd5',
                            200: '#fed7aa',
                            300: '#fdba74',
                            400: '#fb923c',
                            500: '#f97316',
                            600: '#ea580c',
                            700: '#c2410c',
                            800: '#9a3412',
                            900: '#7c2d12',
                            950: '#431407',
                        },
                        terracotta: {
                            50: '#fdf8f6',
                            100: '#fbeee9',
                            500: '#d97706',
                            600: '#b45309',
                            700: '#92400e',
                        },
                        cream: '#fdfbf7',
                        cardbg: '#ffffff'
                    },
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', "SF Pro Display", "SF Pro Text", "Helvetica Neue", 'Segoe UI', 'Roboto', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #2b1810;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
            overflow-x: hidden;
        }
        /* Custom scrollbars for clean mobile feel */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #fed7aa;
            border-radius: 9999px;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* --- Invoice preview (A4 @ 96dpi = 794 x 1123 px, di-scale agar muat layar) --- */
        .inv-scale-wrap { position: relative; margin: 0 auto; overflow: hidden; }
        .inv-paper {
            position: absolute; top: 0; left: 0;
            width: 794px; min-height: 1123px;
            transform-origin: top left;
            background: #fff; color: #1f2937;
            padding: 68px 68px 60px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.12);
            font-family: Helvetica, Arial, sans-serif;
            display: flex; flex-direction: column;
        }
        .inv-paper::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 19px; background: #ea580c; }
        .inv-paper * { box-sizing: border-box; }
        .inv-head { display: flex; justify-content: space-between; align-items: flex-start; padding-bottom: 22px; border-bottom: 1px solid #e5e7eb; }
        .inv-brand { display: flex; align-items: center; gap: 14px; }
        .inv-logo { width: 60px; height: 60px; border-radius: 14px; background: #ea580c; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 30px; }
        .inv-brand-name { font-size: 26px; font-weight: 700; color: #111827; line-height: 1.1; }
        .inv-brand-sub { font-size: 14px; color: #6b7280; margin-top: 4px; }
        .inv-title { text-align: right; }
        .inv-title h2 { font-size: 38px; font-weight: 800; letter-spacing: 3px; color: #c2410c; margin: 0; line-height: 1; }
        .inv-title p { font-size: 14px; color: #4b5563; margin-top: 8px; }
        .inv-info { display: flex; justify-content: space-between; gap: 32px; margin-top: 30px; }
        .inv-label { font-size: 11px; font-weight: 700; letter-spacing: 1px; color: #6b7280; text-transform: uppercase; }
        .inv-customer { font-size: 20px; font-weight: 700; color: #111827; margin-top: 8px; word-break: break-word; max-width: 320px; }
        .inv-meta { width: 292px; font-size: 13.5px; }
        .inv-meta-row { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; }
        .inv-meta-row span:first-child { color: #6b7280; }
        .inv-meta-row span:last-child { font-weight: 700; color: #111827; text-align: right; }
        .inv-status { display: inline-block; border: 1.5px solid #374151; border-radius: 999px; padding: 1px 10px; font-size: 12px; }
        .inv-table { width: 100%; border-collapse: collapse; margin-top: 34px; font-size: 13.5px; }
        .inv-table th { background: #c2410c; color: #fff; font-size: 12px; font-weight: 700; text-align: left; padding: 10px 12px; }
        .inv-table td { padding: 12px; border-bottom: 1px solid #e5e7eb; vertical-align: top; }
        .inv-table .r { text-align: right; } .inv-table .c { text-align: center; }
        .inv-item-name { font-weight: 700; color: #111827; word-break: break-word; }
        .inv-item-sub { font-size: 11.5px; color: #6b7280; margin-top: 3px; word-break: break-word; }
        .inv-muted { color: #9ca3af; font-style: italic; }
        .inv-totals { margin-left: auto; width: 292px; margin-top: 18px; font-size: 13.5px; }
        .inv-grand { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; padding: 12px 14px; border: 1.5px solid #ea580c; border-radius: 8px; background: #fff7ed; }
        .inv-grand span:first-child { font-weight: 700; font-size: 14px; }
        .inv-grand span:last-child { font-weight: 800; font-size: 20px; color: #9a3412; }
        .inv-notes { margin-top: 30px; }
        .inv-notes-box { margin-top: 8px; padding: 12px 14px; border: 1px solid #e5e7eb; border-left: 4px solid #ea580c; border-radius: 6px; font-size: 13.5px; white-space: pre-wrap; word-break: break-word; }
        .inv-foot { margin-top: auto; padding-top: 22px; border-top: 1px solid #e5e7eb; display: flex; justify-content: space-between; font-size: 11.5px; color: #6b7280; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-0 sm:p-4">

    <!-- iPhone Device Mockup Frame -->
    <div id="app-container" class="w-full max-w-[430px] min-w-[320px] h-[100vh] sm:h-[880px] bg-cream sm:rounded-[48px] sm:shadow-2xl sm:border-[10px] sm:border-[#1e110b] flex flex-col relative overflow-hidden">
        
        <!-- Top Dynamic Notch-Free Header -->
        <header class="bg-gradient-to-r from-bakery-800 to-bakery-600 text-white px-5 pt-4 pb-4 shadow-md flex items-center justify-between shrink-0 z-20">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-2xl bg-white/15 backdrop-blur flex items-center justify-center text-bakery-100 shadow-inner">
                    <i class="fa-solid fa-wheat-awn text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg tracking-tight leading-tight">Daily Bread</h1>
                    <p class="text-xs text-bakery-100 opacity-90 font-medium">Bakery & Pastry Studio</p>
                </div>
            </div>
        </header>

        <!-- Main Dynamic View Area -->
        <main class="flex-1 overflow-y-auto pb-24 relative bg-[#fdfbf7]" id="main-content">
            <!-- Dynamic tab content gets injected here -->
        </main>

        <!-- Bottom Navigation Bar -->
        <nav class="absolute bottom-0 left-0 right-0 h-20 bg-white/95 backdrop-blur-md border-t border-bakery-100 px-3 flex items-center justify-around z-30 shadow-[0_-4px_20px_rgba(0,0,0,0.06)]">
            <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center justify-center flex-1 py-1 text-bakery-600 transition group">
                <div class="w-10 h-10 rounded-full flex items-center justify-center transition group-hover:bg-bakery-50">
                    <i class="fa-solid fa-house text-lg"></i>
                </div>
                <span class="text-[11px] font-semibold tracking-tight">Home</span>
            </button>
            <button onclick="switchTab('booking')" id="nav-booking" class="flex flex-col items-center justify-center flex-1 py-1 text-gray-400 transition group">
                <div class="w-10 h-10 rounded-full flex items-center justify-center transition group-hover:bg-bakery-50">
                    <i class="fa-solid fa-calendar-days text-lg"></i>
                </div>
                <span class="text-[11px] font-medium tracking-tight">Booking</span>
            </button>
            <button onclick="switchTab('pnl')" id="nav-pnl" class="flex flex-col items-center justify-center flex-1 py-1 text-gray-400 transition group">
                <div class="w-10 h-10 rounded-full flex items-center justify-center transition group-hover:bg-bakery-50">
                    <i class="fa-solid fa-chart-pie text-lg"></i>
                </div>
                <span class="text-[11px] font-medium tracking-tight">P & L</span>
            </button>
            <button onclick="switchTab('setting')" id="nav-setting" class="flex flex-col items-center justify-center flex-1 py-1 text-gray-400 transition group">
                <div class="w-10 h-10 rounded-full flex items-center justify-center transition group-hover:bg-bakery-50">
                    <i class="fa-solid fa-gear text-lg"></i>
                </div>
                <span class="text-[11px] font-medium tracking-tight">Setting</span>
            </button>
        </nav>

        <!-- Global Notification Toast -->
        <div id="toast" class="absolute top-16 left-4 right-4 bg-gray-900/95 text-white text-xs py-3 px-4 rounded-2xl shadow-xl flex items-center justify-between z-50 transform -translate-y-24 opacity-0 transition-all duration-300 pointer-events-none backdrop-blur">
            <div class="flex items-center space-x-2.5">
                <i id="toast-icon" class="fa-solid fa-circle-check text-emerald-400 text-sm"></i>
                <span id="toast-msg" class="font-medium">Berhasil disimpan</span>
            </div>
            <button onclick="hideToast()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <!-- Quick Booking / Add Order Modal -->
        <div id="booking-modal" class="absolute inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden transition-opacity">
            <div class="bg-white w-full sm:max-w-md rounded-t-[32px] sm:rounded-[32px] max-h-[90vh] flex flex-col shadow-2xl overflow-hidden animate-slide-up">
                <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between bg-bakery-50/50">
                    <h3 class="font-bold text-gray-900 text-base" id="modal-title">Buat Booking Baru</h3>
                    <button onclick="closeBookingModal()" class="w-8 h-8 rounded-full bg-gray-200/70 hover:bg-gray-300 flex items-center justify-center text-gray-600 transition"><i class="fa-solid fa-xmark text-sm"></i></button>
                </div>
                <form id="booking-form" onsubmit="handleBookingSubmit(event)" class="p-6 overflow-y-auto space-y-4 flex-1">
                    <input type="hidden" id="edit-booking-id">
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Nama Pemesan</label>
                        <input type="text" id="order-customer" required class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-sm text-gray-800 focus:outline-none focus:border-bakery-500 font-medium" placeholder="Contoh: Ibu Siska">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-gray-700 mb-1">Tanggal Kirim</label>
                            <input type="date" id="order-date" required class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2.5 text-sm text-gray-800 focus:outline-none focus:border-bakery-500 font-medium">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-700 mb-1">Jam Ambil/Kirim</label>
                            <input type="time" id="order-time" required class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2.5 text-sm text-gray-800 focus:outline-none focus:border-bakery-500 font-medium" value="10:00">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Pilih Menu Roti / Kue</label>
                        <div id="modal-menu-items" class="space-y-2 max-h-40 overflow-y-auto pr-1 border border-gray-100 rounded-xl p-2 bg-gray-50/50">
                            <!-- Populated dynamically -->
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-gray-700 mb-1">Jumlah (Qty)</label>
                            <input type="number" id="order-qty" min="1" value="1" required oninput="calculateModalTotal()" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-sm text-gray-800 focus:outline-none focus:border-bakery-500 font-medium">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-700 mb-1">Status Pesanan</label>
                            <select id="order-status" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2.5 text-sm text-gray-800 focus:outline-none focus:border-bakery-500 font-medium">
                                <option value="Pending">Pending</option>
                                <option value="Proses">Diproses</option>
                                <option value="Selesai">Selesai</option>
                                <option value="Batal">Dibatalkan</option>
                            </select>
                        </div>
                    </div>
                    <div class="bg-bakery-50/60 p-3.5 rounded-2xl border border-bakery-200 flex items-center justify-between">
                        <div>
                            <p class="text-[11px] text-bakery-700 font-medium">Estimasi Total Tagihan</p>
                            <p class="text-base font-bold text-bakery-900" id="modal-total-preview">Rp 0</p>
                        </div>
                        <div class="text-right">
                            <p class="text-[11px] text-gray-500 font-medium">Estimasi HPP</p>
                            <p class="text-xs font-bold text-gray-700" id="modal-hpp-preview">Rp 0</p>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Catatan Khusus (Opsional)</label>
                        <input type="text" id="order-notes" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-sm text-gray-800 focus:outline-none focus:border-bakery-500 font-medium" placeholder="Misal: Tanpa taburan keju, ucapan selamat ulang tahun">
                    </div>
                    <div class="pt-2">
                        <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-bakery-600 to-bakery-700 hover:from-bakery-700 hover:to-bakery-800 text-white rounded-2xl font-bold shadow-lg shadow-bakery-600/30 transition text-sm">
                            Simpan Booking
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Menu Item Add/Edit Modal (Setting Tab) -->
        <div id="menu-modal" class="absolute inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden transition-opacity">
            <div class="bg-white w-full sm:max-w-md rounded-t-[32px] sm:rounded-[32px] max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
                <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between bg-bakery-50/50">
                    <h3 class="font-bold text-gray-900 text-base" id="menu-modal-title">Tambah Menu Baru</h3>
                    <button onclick="closeMenuModal()" class="w-8 h-8 rounded-full bg-gray-200/70 hover:bg-gray-300 flex items-center justify-center text-gray-600 transition"><i class="fa-solid fa-xmark text-sm"></i></button>
                </div>
                <form id="menu-form" onsubmit="handleMenuSubmit(event)" class="p-6 overflow-y-auto space-y-4 flex-1">
                    <input type="hidden" id="edit-menu-id">
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Nama Produk / Roti</label>
                        <input type="text" id="menu-name" required class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-sm text-gray-800 focus:outline-none focus:border-bakery-500 font-medium" placeholder="Misal: Sourdough Loaf 500g">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Kategori</label>
                        <select id="menu-category" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2.5 text-sm text-gray-800 focus:outline-none focus:border-bakery-500 font-medium">
                            <option value="Roti Artisanal">Roti Artisanal</option>
                            <option value="Pastry & Croissant">Pastry & Croissant</option>
                            <option value="Cake & Tart">Cake & Tart</option>
                            <option value="Cookies & Snack">Cookies & Snack</option>
                            <option value="Minuman">Minuman</option>
                        </select>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-gray-700 mb-1">HPP (Modal) - Rp</label>
                            <input type="number" id="menu-hpp" min="0" required class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-sm text-gray-800 focus:outline-none focus:border-bakery-500 font-medium" placeholder="12000">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-700 mb-1">Harga Jual - Rp</label>
                            <input type="number" id="menu-price" min="0" required class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-sm text-gray-800 focus:outline-none focus:border-bakery-500 font-medium" placeholder="22000">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Deskripsi Singkat</label>
                        <input type="text" id="menu-desc" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-sm text-gray-800 focus:outline-none focus:border-bakery-500 font-medium" placeholder="Dibuat dengan ragi alami...">
                    </div>
                    <div class="pt-2">
                        <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-bakery-600 to-bakery-700 hover:from-bakery-700 hover:to-bakery-800 text-white rounded-2xl font-bold shadow-lg shadow-bakery-600/30 transition text-sm">
                            Simpan Menu
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Invoice Preview Modal -->
        <div id="invoice-modal" class="absolute inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden" role="dialog" aria-modal="true" aria-labelledby="invoice-modal-title">
            <div class="bg-white w-full sm:max-w-md rounded-t-[32px] sm:rounded-[32px] h-[92%] sm:h-full flex flex-col shadow-2xl overflow-hidden">
                <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between bg-bakery-50/50 shrink-0">
                    <div class="min-w-0">
                        <h3 class="font-bold text-gray-900 text-base" id="invoice-modal-title">Preview Invoice</h3>
                        <p class="text-[11px] text-gray-500 font-medium truncate" id="invoice-modal-subtitle"></p>
                    </div>
                    <button onclick="closeInvoicePreview()" class="w-8 h-8 shrink-0 rounded-full bg-gray-200/70 hover:bg-gray-300 flex items-center justify-center text-gray-600 transition" aria-label="Tutup"><i class="fa-solid fa-xmark text-sm"></i></button>
                </div>
                <div id="invoice-body" class="flex-1 overflow-y-auto bg-gray-100 p-3 space-y-3">
                    <div id="invoice-alert" class="hidden bg-red-50 border border-red-200 text-red-700 rounded-2xl px-4 py-3 text-xs font-medium flex items-start space-x-2.5" role="alert">
                        <i id="invoice-alert-icon" class="fa-solid fa-circle-exclamation text-red-500 text-sm mt-0.5"></i>
                        <span id="invoice-alert-msg"></span>
                    </div>
                    <div id="invoice-loading" class="hidden flex flex-col items-center justify-center py-20 text-center" aria-live="polite">
                        <div class="w-10 h-10 border-4 border-bakery-100 border-t-bakery-600 rounded-full animate-spin"></div>
                        <p class="text-xs font-bold text-gray-700 mt-4" id="invoice-loading-msg">Menyiapkan invoice...</p>
                    </div>
                    <div id="invoice-scale-wrap" class="inv-scale-wrap hidden">
                        <div id="invoice-paper" class="inv-paper"></div>
                    </div>
                </div>
                <div class="p-4 border-t border-gray-100 grid grid-cols-2 gap-3 shrink-0 bg-white">
                    <button onclick="closeInvoicePreview()" class="py-3 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-2xl font-bold text-sm transition flex items-center justify-center space-x-2">
                        <i class="fa-solid fa-arrow-left text-xs"></i><span>Kembali</span>
                    </button>
                    <button id="invoice-download-btn" onclick="downloadCurrentInvoice()" disabled class="py-3 bg-gradient-to-r from-bakery-600 to-bakery-700 hover:from-bakery-700 hover:to-bakery-800 text-white rounded-2xl font-bold shadow-lg shadow-bakery-600/30 transition text-sm flex items-center justify-center space-x-2 disabled:opacity-60 disabled:cursor-not-allowed">
                        <i class="fa-solid fa-file-arrow-down text-xs" id="invoice-download-icon"></i><span id="invoice-download-label">Download PDF</span>
                    </button>
                </div>
            </div>
        </div>

    </div>

    <script>
        // --- Application State ---
        let currentTab = 'home';
        let privacyMode = false;

        // Default Menus
        let menuItems = [
            { id: 1, name: 'Sourdough Country Loaf', category: 'Roti Artisanal', hpp: 18000, price: 35000, desc: 'Classic fermented sourdough bread' },
            { id: 2, name: 'Butter Croissant', category: 'Pastry & Croissant', hpp: 7500, price: 16000, desc: 'Flaky and buttery French pastry' },
            { id: 3, name: 'Choco Lava Danish', category: 'Pastry & Croissant', hpp: 9000, price: 19000, desc: 'Rich chocolate pastry' },
            { id: 4, name: 'Japanese Milk Bread', category: 'Roti Artisanal', hpp: 14000, price: 28000, desc: 'Soft and fluffy shokupan loaf' },
            { id: 5, name: 'Almond Croissant', category: 'Pastry & Croissant', hpp: 11000, price: 24000, desc: 'Filled with almond cream and sliced almonds' },
            { id: 6, name: 'Fudge Brownie Slice', category: 'Cake & Tart', hpp: 8000, price: 18000, desc: 'Dense dark chocolate fudge brownie' }
        ];

        // Default Bookings (including dates around today)
        const todayDateObj = new Date();
        const formatDateStr = (d) => {
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        };

        const todayStr = formatDateStr(todayDateObj);
        
        let bookings = [
            { id: 101, customer: 'Bpk. Budi Santoso', date: todayStr, time: '08:30', menuId: 1, qty: 3, status: 'Proses', notes: 'Iris tebal' },
            { id: 102, customer: 'Ibu Ratna', date: todayStr, time: '10:00', menuId: 2, qty: 10, status: 'Selesai', notes: 'Box isi 10' },
            { id: 103, customer: 'Cafe Senja', date: todayStr, time: '14:15', menuId: 4, qty: 5, status: 'Pending', notes: 'Langsungantar' },
            { id: 104, customer: 'Anisa Maharani', date: formatDateStr(new Date(todayDateObj.getTime() + 86400000)), time: '09:00', menuId: 5, qty: 4, status: 'Pending', notes: 'Untuk ulang tahun' },
            { id: 105, customer: 'Pak Joko', date: formatDateStr(new Date(todayDateObj.getTime() + 2 * 86400000)), time: '11:30', menuId: 3, qty: 6, status: 'Proses', notes: '' },
            { id: 106, customer: 'Hotel Merdeka', date: formatDateStr(new Date(todayDateObj.getTime() - 86400000)), time: '07:00', menuId: 1, qty: 15, status: 'Selesai', notes: 'Breakfast supply' },
        ];

        // --- Status pesanan (satu sumber kebenaran) ---
        const ORDER_STATUS = Object.freeze({
            PENDING: 'Pending',
            PROSES: 'Proses',
            SELESAI: 'Selesai',
            BATAL: 'Batal'
        });
        // Variasi huruf / istilah dari data dipetakan ke status baku
        const ORDER_STATUS_ALIASES = {
            'pending': ORDER_STATUS.PENDING, 'menunggu': ORDER_STATUS.PENDING,
            'proses': ORDER_STATUS.PROSES, 'diproses': ORDER_STATUS.PROSES, 'processing': ORDER_STATUS.PROSES, 'in progress': ORDER_STATUS.PROSES,
            'selesai': ORDER_STATUS.SELESAI, 'done': ORDER_STATUS.SELESAI, 'complete': ORDER_STATUS.SELESAI, 'completed': ORDER_STATUS.SELESAI,
            'batal': ORDER_STATUS.BATAL, 'dibatalkan': ORDER_STATUS.BATAL, 'cancel': ORDER_STATUS.BATAL, 'canceled': ORDER_STATUS.BATAL, 'cancelled': ORDER_STATUS.BATAL
        };
        function normalizeStatus(value) {
            const key = String(value ?? '').trim().toLowerCase().replace(/\s+/g, ' ');
            return ORDER_STATUS_ALIASES[key] || null; // null = status tidak dikenal
        }
        function getStatusLabel(value) {
            return normalizeStatus(value) || String(value ?? '').trim() || '-';
        }
        // Pesanan aktif tampil di Home & daftar utama Booking.
        // Pesanan Selesai/Batal tetap tersimpan di data dan tampil di Riwayat Pesanan (arsip).
        const ACTIVE_STATUSES = [ORDER_STATUS.PENDING, ORDER_STATUS.PROSES];
        function isActiveOrder(order) {
            return ACTIVE_STATUSES.includes(normalizeStatus(order.status));
        }
        function isCancelledOrder(order) {
            return normalizeStatus(order.status) === ORDER_STATUS.BATAL;
        }

        // Format Currency Helper
        function formatIDR(amount) {
            if (privacyMode) return 'Rp ••••••';
            return 'Rp ' + Number(amount).toLocaleString('id-ID');
        }

        // Toggle Privacy Mask
        function togglePrivacy() {
            privacyMode = !privacyMode;
            const icon = document.getElementById('privacy-icon');
            icon.className = privacyMode ? 'fa-solid fa-eye-slash text-sm' : 'fa-solid fa-eye text-sm';
            renderCurrentTab();
        }

        // Toast notification helper
        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-msg');
            const toastIcon = document.getElementById('toast-icon');
            toastMsg.innerText = msg;
            toastIcon.className = isError ? 'fa-solid fa-circle-exclamation text-red-400 text-sm' : 'fa-solid fa-circle-check text-emerald-400 text-sm';
            toast.classList.remove('-translate-y-24', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            setTimeout(() => hideToast(), 3000);
        }

        function hideToast() {
            const toast = document.getElementById('toast');
            toast.classList.remove('translate-y-0', 'opacity-100');
            toast.classList.add('-translate-y-24', 'opacity-0');
        }

        // Tab Switcher
        function switchTab(tabName) {
            currentTab = tabName;
            if (tabName === 'booking') bookingView = 'active';
            ['home', 'booking', 'pnl', 'setting'].forEach(t => {
                const btn = document.getElementById(`nav-${t}`);
                if (t === tabName) {
                    btn.className = 'flex flex-col items-center justify-center flex-1 py-1 text-bakery-600 transition group font-bold';
                    btn.querySelector('div').className = 'w-10 h-10 rounded-full bg-bakery-50 flex items-center justify-center transition';
                    btn.querySelector('span').className = 'text-[11px] font-bold tracking-tight text-bakery-700';
                } else {
                    btn.className = 'flex flex-col items-center justify-center flex-1 py-1 text-gray-400 transition group';
                    btn.querySelector('div').className = 'w-10 h-10 rounded-full flex items-center justify-center transition group-hover:bg-bakery-50';
                    btn.querySelector('span').className = 'text-[11px] font-medium tracking-tight text-gray-500';
                }
            });
            renderCurrentTab();
        }

        function renderCurrentTab() {
            const container = document.getElementById('main-content');
            if (currentTab === 'home') renderHomeTab(container);
            else if (currentTab === 'booking') renderBookingTab(container);
            else if (currentTab === 'pnl') renderPnlTab(container);
            else if (currentTab === 'setting') renderSettingTab(container);
        }

        // --- 1. HOME TAB (7-Day Chronological Schedule & Quick Booking) ---
        function renderHomeTab(container) {
            // Generate 7 days starting from today (Today + next 6 days)
            let daysList = [];
            for (let i = 0; i <= 6; i++) {
                let d = new Date();
                d.setDate(d.getDate() + i);
                daysList.push({
                    dateObj: d,
                    dateStr: formatDateStr(d),
                    dayName: d.toLocaleDateString('id-ID', { weekday: 'short' }),
                    dayNum: d.getDate(),
                    monthName: d.toLocaleDateString('id-ID', { month: 'short' }),
                    isToday: i === 0
                });
            }

            let todayRevenue = 0;
            let todayOrdersCount = 0;
            bookings.forEach(b => {
                // Potensi omset: aturan bisnis yang sama dengan P&L (semua pesanan kecuali Batal)
                if (b.date === todayStr && !isCancelledOrder(b)) {
                    const menu = menuItems.find(m => m.id == b.menuId);
                    if (menu) todayRevenue += menu.price * b.qty;
                }
                // Jumlah pesanan: hanya pesanan aktif yang tampil di jadwal
                if (b.date === todayStr && isActiveOrder(b)) todayOrdersCount++;
            });

            let html = `
                <div class="p-4 space-y-4">
                    <!-- Daily Summary Banner -->
                    <div class="bg-gradient-to-br from-bakery-500 to-bakery-700 rounded-3xl p-5 text-white shadow-xl relative overflow-hidden">
                        <div class="absolute -right-6 -bottom-6 w-32 h-32 bg-white/10 rounded-full pointer-events-none"></div>
                        <div class="flex justify-between items-start mb-3">
                            <div>
                                <p class="text-xs uppercase tracking-wider text-bakery-100 font-semibold">Jadwal Hari Ini</p>
                                <h2 class="text-xl font-bold tracking-tight">${new Date().toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}</h2>
                            </div>
                            <span class="bg-white/20 px-3 py-1 rounded-full text-xs font-bold backdrop-blur">${todayOrdersCount} Pesanan</span>
                        </div>
                        <div class="grid grid-cols-2 gap-3 pt-2 border-t border-white/15">
                            <div>
                                <p class="text-[11px] text-bakery-100">Potensi Omset Hari Ini</p>
                                <p class="text-lg font-extrabold">${formatIDR(todayRevenue)}</p>
                            </div>
                            <div class="text-right">
                                <button onclick="openQuickBookingModal()" class="bg-white text-bakery-800 text-xs font-bold px-4 py-2.5 rounded-2xl shadow hover:bg-bakery-50 transition inline-flex items-center space-x-1.5 mt-1">
                                    <i class="fa-solid fa-plus text-bakery-600"></i>
                                    <span>Booking Cepat</span>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- 7-Day Horizontal Date Bar -->
                    <div class="bg-white rounded-3xl p-3.5 shadow-sm border border-bakery-100">
                        <p class="text-xs font-bold text-gray-700 mb-2 px-1 flex items-center justify-between">
                            <span><i class="fa-solid fa-calendar-week text-bakery-500 mr-1.5"></i> Kalender 7 Hari Kedepan</span>
                            <span class="text-[10px] text-gray-400 font-normal">Geser untuk melihat</span>
                        </p>
                        <div class="flex space-x-2 overflow-x-auto hide-scrollbar pb-1">
            `;

            daysList.forEach(day => {
                const dayOrders = bookings.filter(b => b.date === day.dateStr && isActiveOrder(b));
                const isSelected = (day.dateStr === selectedDateFilter);
                
                html += `
                    <div onclick="filterHomeDate('${day.dateStr}')" class="flex-shrink-0 w-16 py-3 px-1 rounded-2xl text-center cursor-pointer transition border ${day.isToday ? 'border-bakery-500' : 'border-gray-100'} ${isSelected ? 'bg-bakery-600 text-white shadow-md' : 'bg-gray-50/80 hover:bg-bakery-50 text-gray-800'}">
                        <p class="text-[10px] font-semibold uppercase ${isSelected ? 'text-bakery-100' : 'text-gray-500'}">${day.dayName}</p>
                        <p class="text-base font-extrabold my-0.5 ${isSelected ? 'text-white' : 'text-gray-900'}">${day.dayNum}</p>
                        <p class="text-[10px] ${isSelected ? 'text-bakery-100' : 'text-gray-400'}">${day.monthName}</p>
                        <div class="mt-2 flex items-center justify-center">
                            <span class="px-1.5 py-0.5 rounded-full text-[9px] font-bold ${dayOrders.length > 0 ? (isSelected ? 'bg-white text-bakery-700' : 'bg-bakery-100 text-bakery-700') : 'bg-gray-200 text-gray-500'}">${dayOrders.length} ord</span>
                        </div>
                    </div>
                `;
            });

            html += `
                        </div>
                    </div>

                    <!-- Vertical Chronological Timeline for Selected Date -->
                    <div class="space-y-3">
                        <div class="flex items-center justify-between px-1">
                            <h3 class="text-xs font-bold text-gray-700 uppercase tracking-wide">
                                <i class="fa-solid fa-clock-rotate-left text-bakery-500 mr-1.5"></i> Jadwal Pesanan (${formatDisplayDate(selectedDateFilter)})
                            </h3>
                            <button onclick="resetHomeDate()" class="text-xs text-bakery-600 font-bold hover:underline">Hari Ini</button>
                        </div>
            `;

            const filteredBookings = bookings.filter(b => b.date === selectedDateFilter && isActiveOrder(b)).sort((a,b) => a.time.localeCompare(b.time));

            if (filteredBookings.length === 0) {
                html += `
                    <div class="bg-white rounded-3xl p-8 text-center border border-gray-100 shadow-sm">
                        <div class="w-12 h-12 bg-bakery-50 rounded-full flex items-center justify-center mx-auto mb-3 text-bakery-500">
                            <i class="fa-solid fa-mug-hot text-xl"></i>
                        </div>
                        <p class="text-sm font-bold text-gray-800">Tidak ada pesanan aktif</p>
                        <p class="text-xs text-gray-400 mt-1">Belum ada pesanan aktif untuk tanggal ini. Pesanan selesai dapat dilihat di Riwayat Pesanan.</p>
                        <button onclick="openQuickBookingModalWithDate('${selectedDateFilter}')" class="mt-4 px-4 py-2 bg-bakery-600 text-white rounded-xl text-xs font-bold shadow hover:bg-bakery-700 transition">
                            + Tambah Pesanan Tanggal Ini
                        </button>
                    </div>
                `;
            } else {
                filteredBookings.forEach(order => {
                    const menu = menuItems.find(m => m.id == order.menuId) || { name: 'Menu Dihapus', price: 0 };
                    const totalPrice = menu.price * order.qty;
                    
                    const statusBadge = getStatusBadgeClass(order.status);
                    const statusKey = normalizeStatus(order.status);

                    html += `
                        <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 flex items-start justify-between relative hover:border-bakery-300 transition">
                            <div class="absolute left-0 top-3 bottom-3 w-1.5 rounded-r-full ${statusKey === ORDER_STATUS.SELESAI ? 'bg-emerald-500' : statusKey === ORDER_STATUS.PROSES ? 'bg-blue-500' : 'bg-amber-500'}"></div>
                            <div class="pl-2.5 flex-1">
                                <div class="flex items-center justify-between mb-1">
                                    <span class="text-xs font-bold text-bakery-700 bg-bakery-50 px-2 py-0.5 rounded-lg">
                                        <i class="fa-regular fa-clock mr-1"></i> ${order.time} WIB
                                    </span>
                                    <span class="text-[10px] px-2 py-0.5 rounded-full font-bold border ${statusBadge}">${getStatusLabel(order.status)}</span>
                                </div>
                                <h4 class="font-bold text-gray-900 text-sm mt-1">${order.customer}</h4>
                                <p class="text-xs font-semibold text-gray-700 mt-0.5">${order.qty}x ${menu.name}</p>
                                ${order.notes ? `<p class="text-[11px] text-gray-500 italic mt-1 bg-gray-50 px-2.5 py-1 rounded-xl border border-gray-100"><i class="fa-solid fa-note-sticky mr-1 text-bakery-400"></i> ${order.notes}</p>` : ''}
                            </div>
                            <div class="text-right ml-3 shrink-0 flex flex-col items-end justify-between self-stretch">
                                <span class="text-xs font-extrabold text-bakery-900">${formatIDR(totalPrice)}</span>
                                <div class="flex space-x-1 mt-auto">
                                    <button onclick="openInvoicePreview(${order.id})" class="w-7 h-7 rounded-lg bg-gray-100 hover:bg-bakery-100 text-gray-600 hover:text-bakery-700 flex items-center justify-center text-xs transition" title="Cetak Invoice" aria-label="Cetak Invoice">
                                        <i class="fa-solid fa-print"></i>
                                    </button>
                                    <button onclick="editBooking(${order.id})" class="w-7 h-7 rounded-lg bg-gray-100 hover:bg-bakery-100 text-gray-600 hover:text-bakery-700 flex items-center justify-center text-xs transition" title="Edit">
                                        <i class="fa-solid fa-pen"></i>
                                    </button>
                                    <button onclick="deleteBooking(${order.id})" class="w-7 h-7 rounded-lg bg-red-50 hover:bg-red-100 text-red-600 flex items-center justify-center text-xs transition" title="Hapus">
                                        <i class="fa-solid fa-trash"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                });
            }

            html += `
                    </div>
                </div>
            `;
            container.innerHTML = html;
        }

        let selectedDateFilter = todayStr;
        function filterHomeDate(dateStr) {
            selectedDateFilter = dateStr;
            renderCurrentTab();
        }
        function resetHomeDate() {
            selectedDateFilter = todayStr;
            renderCurrentTab();
        }
        function formatDisplayDate(dateStr) {
            const parts = dateStr.split('-');
            const d = new Date(parts[0], parts[1] - 1, parts[2]);
            return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
        }


        // --- 2. BOOKING TAB (Daftar pesanan aktif + Riwayat Pesanan) ---
        let bookingSearchQuery = '';
        let bookingStatusFilter = 'ALL';
        let bookingView = 'active';   // 'active' | 'history'
        const ACTIVE_STATUS_FILTERS = ['ALL', ...ACTIVE_STATUSES];

        function getStatusBadgeClass(status) {
            const st = normalizeStatus(status);
            if (st === ORDER_STATUS.PENDING) return 'bg-amber-100 text-amber-800 border-amber-200';
            if (st === ORDER_STATUS.PROSES) return 'bg-blue-100 text-blue-800 border-blue-200';
            if (st === ORDER_STATUS.SELESAI) return 'bg-emerald-100 text-emerald-800 border-emerald-200';
            if (st === ORDER_STATUS.BATAL) return 'bg-red-100 text-red-800 border-red-200';
            return 'bg-gray-100 text-gray-700 border-gray-200'; // status tidak dikenal
        }

        function orderMatchesSearch(order, query) {
            const q = String(query || '').trim().toLowerCase();
            if (!q) return true;
            const menu = menuItems.find(m => m.id == order.menuId) || { name: '' };
            return String(order.customer || '').toLowerCase().includes(q) || String(menu.name || '').toLowerCase().includes(q);
        }

        // Kartu pesanan (dipakai daftar aktif & Riwayat Pesanan)
        function renderBookingCardHTML(order) {
            const menu = menuItems.find(m => m.id == order.menuId) || { name: 'Menu Dihapus', price: 0 };
            const totalPrice = menu.price * order.qty;
            const statusBadge = getStatusBadgeClass(order.status);
            return `
                        <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 space-y-3 relative hover:border-bakery-300 transition">
                            <div class="flex items-center justify-between border-b border-gray-100 pb-2.5">
                                <div class="flex items-center space-x-2">
                                    <span class="text-xs font-bold text-bakery-700 bg-bakery-50 px-2.5 py-1 rounded-xl">
                                        <i class="fa-regular fa-calendar mr-1"></i> ${formatDisplayDate(order.date)} (${order.time})
                                    </span>
                                </div>
                                <select onchange="updateOrderStatus(${order.id}, this.value)" class="text-xs font-bold px-2.5 py-1 rounded-full border ${statusBadge} focus:outline-none cursor-pointer">
                                    <option value="${ORDER_STATUS.PENDING}" ${normalizeStatus(order.status) === ORDER_STATUS.PENDING ? 'selected' : ''}>Pending</option>
                                    <option value="${ORDER_STATUS.PROSES}" ${normalizeStatus(order.status) === ORDER_STATUS.PROSES ? 'selected' : ''}>Proses</option>
                                    <option value="${ORDER_STATUS.SELESAI}" ${normalizeStatus(order.status) === ORDER_STATUS.SELESAI ? 'selected' : ''}>Selesai</option>
                                    <option value="${ORDER_STATUS.BATAL}" ${normalizeStatus(order.status) === ORDER_STATUS.BATAL ? 'selected' : ''}>Batal</option>
                                </select>
                            </div>
                            <div class="flex justify-between items-start">
                                <div>
                                    <h4 class="font-bold text-gray-900 text-sm">${order.customer}</h4>
                                    <p class="text-xs font-semibold text-gray-700 mt-0.5">${order.qty}x ${menu.name}</p>
                                    ${order.notes ? `<p class="text-[11px] text-gray-500 italic mt-1"><i class="fa-solid fa-note-sticky mr-1 text-bakery-400"></i> ${order.notes}</p>` : ''}
                                </div>
                                <div class="text-right">
                                    <p class="text-xs font-extrabold text-bakery-900">${formatIDR(totalPrice)}</p>
                                    <p class="text-[10px] text-gray-400 mt-0.5">@ ${formatIDR(menu.price)}</p>
                                </div>
                            </div>
                            <div class="flex items-center justify-end space-x-2 pt-1 border-t border-gray-50">
                                <button type="button" onclick="event.stopPropagation(); openInvoicePreview(${order.id})" class="w-7 h-7 rounded-lg bg-gray-100 hover:bg-bakery-100 text-gray-600 hover:text-bakery-700 flex items-center justify-center text-xs transition" title="Cetak Invoice" aria-label="Cetak Invoice">
                                    <i class="fa-solid fa-print"></i>
                                </button>
                                <button onclick="editBooking(${order.id})" class="px-3 py-1 bg-gray-100 hover:bg-bakery-100 text-gray-700 hover:text-bakery-700 rounded-xl text-xs font-semibold transition flex items-center space-x-1">
                                    <i class="fa-solid fa-pen text-[10px]"></i><span>Edit</span>
                                </button>
                                <button onclick="deleteBooking(${order.id})" class="px-3 py-1 bg-red-50 hover:bg-red-100 text-red-600 rounded-xl text-xs font-semibold transition flex items-center space-x-1">
                                    <i class="fa-solid fa-trash text-[10px]"></i><span>Hapus</span>
                                </button>
                            </div>
                        </div>
            `;
        }

        function renderBookingTab(container) {
            if (bookingView === 'history') {
                renderOrderHistory(container);
                return;
            }
            if (!ACTIVE_STATUS_FILTERS.includes(bookingStatusFilter)) bookingStatusFilter = 'ALL';

            let html = `
                <div class="p-4 space-y-4">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-3 min-w-0">
                            <div class="w-10 h-10 shrink-0 rounded-2xl bg-gradient-to-br from-bakery-400 to-bakery-700 text-white flex items-center justify-center shadow-md shadow-bakery-500/30 ring-4 ring-bakery-100">
                                <i class="fa-solid fa-calendar-check text-base"></i>
                            </div>
                            <h2 class="text-lg font-extrabold text-gray-900 tracking-tight">Kelola Booking</h2>
                        </div>
                        <button onclick="openQuickBookingModal()" class="px-3.5 py-2 bg-bakery-600 text-white rounded-xl text-xs font-bold shadow hover:bg-bakery-700 transition flex items-center space-x-1.5">
                            <i class="fa-solid fa-plus"></i>
                            <span>Tambah Booking</span>
                        </button>
                    </div>

                    <!-- Search & Filter Controls -->
                    <div class="space-y-2.5">
                        <div class="relative">
                            <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-gray-400 text-sm"></i>
                            <input type="text" id="booking-search-input" value="${escapeHTML(bookingSearchQuery)}" oninput="handleBookingSearch(this.value)" placeholder="Cari nama pemesan atau menu roti..." class="w-full bg-white border border-gray-200 rounded-2xl pl-10 pr-4 py-2.5 text-xs text-gray-800 focus:outline-none focus:border-bakery-500 font-medium shadow-sm">
                        </div>
                        <div class="flex space-x-1.5 overflow-x-auto hide-scrollbar pb-1">
            `;

            ACTIVE_STATUS_FILTERS.forEach(st => {
                const isActive = bookingStatusFilter === st;
                const label = st === 'ALL' ? 'Semua Status' : st;
                html += `
                    <button onclick="filterBookingStatus('${st}')" class="px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition border ${isActive ? 'bg-bakery-600 text-white border-bakery-600 shadow' : 'bg-white text-gray-600 border-gray-200 hover:bg-bakery-50'}">
                        ${label}
                    </button>
                `;
            });

            html += `
                        </div>
                        <!-- Tombol Riwayat Pesanan -->
                        <button onclick="openOrderHistory()" class="w-full bg-white border border-gray-200 hover:border-bakery-300 hover:bg-bakery-50/60 rounded-2xl px-3.5 py-3 shadow-sm flex items-center justify-between transition text-left">
                            <span class="flex items-center space-x-3 min-w-0">
                                <span class="w-9 h-9 shrink-0 rounded-xl bg-bakery-50 text-bakery-600 flex items-center justify-center"><i class="fa-solid fa-clock-rotate-left text-sm"></i></span>
                                <span class="min-w-0">
                                    <span class="block text-xs font-bold text-gray-900">Riwayat Pesanan</span>
                                    <span class="block text-[10px] text-gray-500 truncate">Semua pesanan per bulan, termasuk Selesai &amp; Batal</span>
                                </span>
                            </span>
                            <i class="fa-solid fa-chevron-right text-gray-400 text-xs ml-2"></i>
                        </button>
                    </div>

                    <!-- Booking List (hanya pesanan aktif) -->
                    <div id="booking-list" class="space-y-3">${getActiveBookingListHTML()}</div>
                </div>
            `;
            container.innerHTML = html;
        }

        function getActiveBookingListHTML() {
            const filtered = bookings.filter(b =>
                isActiveOrder(b) &&
                orderMatchesSearch(b, bookingSearchQuery) &&
                (bookingStatusFilter === 'ALL' || normalizeStatus(b.status) === bookingStatusFilter)
            ).sort((a,b) => b.date.localeCompare(a.date));

            if (filtered.length === 0) {
                const hasQuery = bookingSearchQuery.trim() !== '' || bookingStatusFilter !== 'ALL';
                return `
                    <div class="bg-white rounded-3xl p-8 text-center border border-gray-100 shadow-sm">
                        <i class="fa-solid fa-folder-open text-gray-300 text-3xl mb-2"></i>
                        <p class="text-sm font-bold text-gray-800">${hasQuery ? 'Tidak ada pesanan ditemukan' : 'Tidak ada pesanan aktif'}</p>
                        <p class="text-xs text-gray-400 mt-1">${hasQuery ? 'Coba ubah kata kunci pencarian atau filter status.' : 'Pesanan Selesai dan Batal dapat dilihat di Riwayat Pesanan.'}</p>
                    </div>
                `;
            }
            return filtered.map(renderBookingCardHTML).join('');
        }

        function handleBookingSearch(val) {
            bookingSearchQuery = val;
            const list = document.getElementById('booking-list');
            if (list) list.innerHTML = getActiveBookingListHTML();
        }

        function filterBookingStatus(st) {
            bookingStatusFilter = st;
            renderCurrentTab();
        }

        function updateOrderStatus(id, newStatus) {
            const order = bookings.find(b => b.id === id);
            if (order) {
                order.status = normalizeStatus(newStatus) || newStatus;
                const movedToHistory = !isActiveOrder(order) && bookingView === 'active';
                showToast(movedToHistory ? `Pesanan ${getStatusLabel(order.status)} dipindahkan ke Riwayat` : `Status pesanan diperbarui jadi ${getStatusLabel(order.status)}`);
                renderCurrentTab();
            }
        }

        // --- RIWAYAT PESANAN (sumber data yang sama: array bookings) ---
        let historyMonth = '';          // 'YYYY-MM' (jadwal booking)
        let historySearchQuery = '';

        function getCurrentMonthStr() {
            return formatDateStr(new Date()).slice(0, 7); // pakai tanggal lokal, bukan UTC
        }

        function openOrderHistory() {
            bookingView = 'history';
            historyMonth = getCurrentMonthStr();
            historySearchQuery = '';
            renderCurrentTab();
            updateOrderHistory({ showLoading: true });
            document.getElementById('main-content').scrollTop = 0;
        }

        function closeOrderHistory() {
            bookingView = 'active';
            renderCurrentTab();
            document.getElementById('main-content').scrollTop = 0;
        }

        function shiftHistoryMonth(delta) {
            let [y, m] = historyMonth.split('-').map(Number);
            m += delta;
            while (m > 12) { m -= 12; y++; }
            while (m < 1) { m += 12; y--; }
            historyMonth = `${y}-${String(m).padStart(2, '0')}`;
            updateOrderHistory({ showLoading: true });
        }

        function setHistoryMonth(val) {
            if (!/^\d{4}-(0[1-9]|1[0-2])$/.test(val)) return;
            historyMonth = val;
            updateOrderHistory({ showLoading: true });
        }

        function handleHistorySearch(val) {
            historySearchQuery = val;
            updateOrderHistory();
        }

        function getHistoryOrders() {
            return bookings
                .filter(b => String(b.date || '').startsWith(historyMonth + '-') && orderMatchesSearch(b, historySearchQuery))
                .sort((a, b) => b.date.localeCompare(a.date) || String(b.time || '').localeCompare(String(a.time || '')));
        }

        function getHistoryListHTML() {
            const orders = getHistoryOrders();
            if (orders.length === 0) {
                const searching = historySearchQuery.trim() !== '';
                return `
                    <div class="bg-white rounded-3xl p-8 text-center border border-gray-100 shadow-sm">
                        <div class="w-12 h-12 bg-bakery-50 rounded-full flex items-center justify-center mx-auto mb-3 text-bakery-500">
                            <i class="fa-solid fa-${searching ? 'magnifying-glass' : 'box-open'} text-xl"></i>
                        </div>
                        <p class="text-sm font-bold text-gray-800">${searching ? 'Tidak ada pesanan yang cocok' : 'Belum ada riwayat pesanan pada bulan ini.'}</p>
                        <p class="text-xs text-gray-400 mt-1">${searching ? `Tidak ditemukan pesanan untuk "${escapeHTML(historySearchQuery.trim())}" di ${formatDisplayMonth(historyMonth)}.` : 'Coba pilih bulan lain.'}</p>
                    </div>
                `;
            }
            const count = (st) => orders.filter(o => normalizeStatus(o.status) === st).length;
            const unknown = orders.filter(o => !normalizeStatus(o.status)).length;
            const chips = [[ORDER_STATUS.SELESAI, 'bg-emerald-50 text-emerald-700'], [ORDER_STATUS.PENDING, 'bg-amber-50 text-amber-700'], [ORDER_STATUS.PROSES, 'bg-blue-50 text-blue-700'], [ORDER_STATUS.BATAL, 'bg-red-50 text-red-700']]
                .filter(([st]) => count(st) > 0)
                .map(([st, cls]) => `<span class="px-2 py-0.5 rounded-full font-bold ${cls}">${count(st)} ${st}</span>`).join('')
                + (unknown ? `<span class="px-2 py-0.5 rounded-full font-bold bg-gray-100 text-gray-600">${unknown} Lainnya</span>` : '');
            return `
                <div class="flex items-center justify-between gap-2 px-1">
                    <p class="text-xs font-bold text-gray-700 shrink-0">${orders.length} pesanan</p>
                    <div class="flex flex-wrap justify-end gap-1 text-[10px]">${chips}</div>
                </div>
                ${orders.map(renderHistoryCardHTML).join('')}
            `;
        }

        // Kartu Riwayat. Pesanan Selesai/Batal = arsip (hanya baca + invoice).
        // Pesanan yang masih aktif di bulan tsb tetap bisa dikelola seperti di daftar Booking.
        function renderHistoryCardHTML(order) {
            const menu = menuItems.find(m => m.id == order.menuId) || null;
            const qty = Number(order.qty) || 0;
            const archived = !isActiveOrder(order);
            const statusBadge = getStatusBadgeClass(order.status);
            const dateLabel = order.date ? formatDisplayDate(order.date) : '-';

                ? `<span class="text-xs font-bold px-2.5 py-1 rounded-full border ${statusBadge}">${escapeHTML(getStatusLabel(order.status))}</span>`

                        ${Object.values(ORDER_STATUS).map(st => `<option value="${st}" ${normalizeStatus(order.status) === st ? 'selected' : ''}>${st}</option>`).join('')}
                   </select>`;

            return `
                <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 space-y-3 relative hover:border-bakery-300 transition">
                    <div class="flex items-center justify-between gap-2 border-b border-gray-100 pb-2.5">
                        <span class="text-xs font-bold text-bakery-700 bg-bakery-50 px-2.5 py-1 rounded-xl min-w-0 truncate">
                            <i class="fa-regular fa-calendar mr-1"></i> ${dateLabel}${timeLabel ? ` &middot; ${timeLabel}` : ''}
                        </span>
                        <div class="shrink-0">${statusControl}</div>
                    </div>
                    <div class="flex justify-between items-start gap-3">
                        <div class="min-w-0">
                            <h4 class="font-bold text-gray-900 text-sm break-words">${escapeHTML(order.customer || '-')}</h4>
                            <p class="text-xs font-semibold text-gray-700 mt-0.5 break-words">${qty}x ${menu ? escapeHTML(menu.name) : '<span class="italic text-gray-400">Menu telah dihapus</span>'}</p>
                            ${order.notes ? `<p class="text-[11px] text-gray-500 italic mt-1 break-words"><i class="fa-solid fa-note-sticky mr-1 text-bakery-400"></i> ${escapeHTML(order.notes)}</p>` : ''}
                        </div>
                        <div class="text-right shrink-0">
                            <p class="text-xs font-extrabold text-bakery-900">${menu ? formatIDR(menu.price * qty) : '-'}</p>
                            <p class="text-[10px] text-gray-400 mt-0.5">${menu ? '@ ' + formatIDR(menu.price) : ''}</p>
                        </div>
                    </div>
                    <div class="flex items-center justify-between space-x-2 pt-1 border-t border-gray-50">
                        <span class="text-[10px] text-gray-400 font-medium">${archived ? '<i class="fa-solid fa-box-archive mr-1"></i> Arsip' : '<i class="fa-solid fa-circle-play mr-1"></i> Masih aktif'}</span>
                        <div class="flex items-center space-x-2">
                            <button onclick="openInvoicePreview(${order.id})" class="px-3 py-1 bg-gray-100 hover:bg-bakery-100 text-gray-700 hover:text-bakery-700 rounded-xl text-xs font-semibold transition flex items-center space-x-1" title="Cetak Invoice" aria-label="Cetak Invoice">
                                <i class="fa-solid fa-print text-[10px]"></i><span>Invoice</span>
                            </button>
                            ${archived ? '' : `
                            <button onclick="editBooking(${order.id})" class="px-3 py-1 bg-gray-100 hover:bg-bakery-100 text-gray-700 hover:text-bakery-700 rounded-xl text-xs font-semibold transition flex items-center space-x-1">
                                <i class="fa-solid fa-pen text-[10px]"></i><span>Edit</span>
                            </button>
                            <button onclick="deleteBooking(${order.id})" class="px-3 py-1 bg-red-50 hover:bg-red-100 text-red-600 rounded-xl text-xs font-semibold transition flex items-center space-x-1">
                                <i class="fa-solid fa-trash text-[10px]"></i><span>Hapus</span>
                            </button>`}
                        </div>
                    </div>
                </div>
            `;
        }

        function getHistoryLoadingHTML() {
            return `
                <div class="bg-white rounded-3xl p-8 text-center border border-gray-100 shadow-sm" aria-live="polite">
                    <div class="w-9 h-9 border-4 border-bakery-100 border-t-bakery-600 rounded-full animate-spin mx-auto"></div>
                    <p class="text-xs font-bold text-gray-700 mt-3">Memuat riwayat pesanan...</p>
                </div>
            `;
        }

        function getHistoryErrorHTML(err) {
            return `
                <div class="bg-white rounded-3xl p-8 text-center border border-red-100 shadow-sm" role="alert">
                    <div class="w-12 h-12 bg-red-50 rounded-full flex items-center justify-center mx-auto mb-3 text-red-500">
                        <i class="fa-solid fa-triangle-exclamation text-xl"></i>
                    </div>
                    <p class="text-sm font-bold text-gray-800">Gagal memuat riwayat pesanan</p>
                    <p class="text-xs text-gray-400 mt-1">${escapeHTML(err && err.message ? err.message : 'Terjadi kesalahan tidak dikenal.')}</p>
                    <button onclick="updateOrderHistory({ showLoading: true })" class="mt-4 px-4 py-2 bg-bakery-600 text-white rounded-xl text-xs font-bold shadow hover:bg-bakery-700 transition">
                        Coba Lagi
                    </button>
                </div>
            `;
        }

        function getSafeHistoryListHTML() {
            try {
                return getHistoryListHTML();
            } catch (err) {
                console.error(err);
                return getHistoryErrorHTML(err);
            }
        }

        // Perbarui label bulan + daftar tanpa me-render ulang input pencarian (fokus tidak hilang).
        // showLoading: tampilkan indikator saat ganti bulan / buka riwayat.
        let historyRenderToken = 0;
        function updateOrderHistory(opts = {}) {
            const label = document.getElementById('history-month-label');
            const input = document.getElementById('history-month-input');
            const list = document.getElementById('history-list');
            if (label) label.innerText = formatDisplayMonth(historyMonth);
            if (input) input.value = historyMonth;
            if (!list) return;
            const token = ++historyRenderToken;
            if (!opts.showLoading) { list.innerHTML = getSafeHistoryListHTML(); return; }
            list.innerHTML = getHistoryLoadingHTML();
            setTimeout(() => {
                if (token !== historyRenderToken) return; // ada permintaan yang lebih baru
                const current = document.getElementById('history-list');
                if (current) current.innerHTML = getSafeHistoryListHTML();
            }, 150);
        }

        function renderOrderHistory(container) {
            if (!historyMonth) historyMonth = getCurrentMonthStr();
            container.innerHTML = `
                <div class="p-4 space-y-4">
                    <div class="flex items-center justify-between gap-2">
                        <div class="flex items-center gap-3 min-w-0">
                            <div class="w-10 h-10 shrink-0 rounded-2xl bg-gradient-to-br from-bakery-400 to-bakery-700 text-white flex items-center justify-center shadow-md shadow-bakery-500/30 ring-4 ring-bakery-100">
                                <i class="fa-solid fa-clock-rotate-left text-base"></i>
                            </div>
                            <h2 class="text-lg font-extrabold text-gray-900 tracking-tight">Riwayat Pesanan</h2>
                        </div>
                        <button onclick="closeOrderHistory()" class="px-3.5 py-2 shrink-0 bg-white border border-gray-200 text-gray-700 rounded-xl text-xs font-bold shadow-sm hover:bg-bakery-50 hover:text-bakery-700 transition flex items-center space-x-1.5" aria-label="Kembali ke Kelola Booking">
                            <i class="fa-solid fa-arrow-left"></i>
                            <span>Kembali</span>
                        </button>
                    </div>

                    <div class="space-y-2.5">
                        <!-- Filter Bulan -->
                        <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-1.5 flex items-center justify-between">
                            <button onclick="shiftHistoryMonth(-1)" class="w-9 h-9 shrink-0 rounded-xl hover:bg-bakery-50 text-gray-600 hover:text-bakery-700 flex items-center justify-center transition" aria-label="Bulan sebelumnya">
                                <i class="fa-solid fa-chevron-left text-xs"></i>
                            </button>
                            <label class="relative flex-1 flex items-center justify-center cursor-pointer py-1.5 rounded-xl hover:bg-bakery-50/60 transition">
                                <i class="fa-regular fa-calendar text-bakery-500 mr-2 text-sm"></i>
                                <span id="history-month-label" class="text-sm font-extrabold text-gray-900">${formatDisplayMonth(historyMonth)}</span>
                                <input type="month" id="history-month-input" value="${historyMonth}" onchange="setHistoryMonth(this.value)" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" aria-label="Pilih bulan riwayat">
                            </label>
                            <button onclick="shiftHistoryMonth(1)" class="w-9 h-9 shrink-0 rounded-xl hover:bg-bakery-50 text-gray-600 hover:text-bakery-700 flex items-center justify-center transition" aria-label="Bulan berikutnya">
                                <i class="fa-solid fa-chevron-right text-xs"></i>
                            </button>
                        </div>
                        <!-- Pencarian -->
                        <div class="relative">
                            <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-gray-400 text-sm"></i>
                            <input type="text" id="history-search-input" value="${escapeHTML(historySearchQuery)}" oninput="handleHistorySearch(this.value)" placeholder="Cari nama pemesan atau menu roti..." class="w-full bg-white border border-gray-200 rounded-2xl pl-10 pr-4 py-2.5 text-xs text-gray-800 focus:outline-none focus:border-bakery-500 font-medium shadow-sm">
                        </div>
                    </div>

                    <div id="history-list" class="space-y-3">${getSafeHistoryListHTML()}</div>
                </div>
            `;
        }


        // --- 3. PROFIT & LOSS TAB (Defaults to Current Month "Bulan Ini" + Privacy Mask) ---
        let selectedPnlMonth = new Date().toISOString().slice(0, 7); // 'YYYY-MM'

        function renderPnlTab(container) {
            // Filter bookings for selected month
            let monthBookings = bookings.filter(b => b.date.startsWith(selectedPnlMonth) && !isCancelledOrder(b));

            let grossRevenue = 0;
            let totalHpp = 0;
            let totalItemsSold = 0;

            monthBookings.forEach(b => {
                const menu = menuItems.find(m => m.id == b.menuId);
                if (menu) {
                    grossRevenue += menu.price * b.qty;
                    totalHpp += menu.hpp * b.qty;
                    totalItemsSold += b.qty;
                }
            });

            // Rumus P&L:
            // Biaya Operasional Est. = Total Pendapatan × 10%
            // Laba Bersih            = Total Pendapatan − Total HPP − Biaya Operasional Est.
            // Margin Laba Bersih     = (Laba Bersih ÷ Total Pendapatan) × 100%
            const OPERATIONAL_EXPENSE_RATE = 0.10;
            const operationalExpense = Math.round(grossRevenue * OPERATIONAL_EXPENSE_RATE);
            const netProfit = grossRevenue - totalHpp - operationalExpense;
            const profitMargin = grossRevenue > 0 ? ((netProfit / grossRevenue) * 100).toFixed(1) : 0;

            let html = `
                <div class="p-4 space-y-4">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-3 min-w-0">
                            <div class="w-10 h-10 shrink-0 rounded-2xl bg-gradient-to-br from-emerald-400 to-emerald-700 text-white flex items-center justify-center shadow-md shadow-emerald-500/30 ring-4 ring-emerald-100">
                                <i class="fa-solid fa-chart-line text-base"></i>
                            </div>
                            <div class="min-w-0">
                                <h2 class="text-lg font-extrabold text-gray-900 tracking-tight">Laba & Rugi (P&L)</h2>
                            </div>
                        </div>
                        <input type="month" id="pnl-month-select" value="${selectedPnlMonth}" onchange="changePnlMonth(this.value)" class="bg-white border border-gray-200 text-xs font-bold text-gray-800 px-3 py-2 rounded-xl focus:outline-none focus:border-bakery-500 shadow-sm">
                    </div>

                    <!-- Main Summary Card -->
                    <div class="bg-gradient-to-br from-gray-900 via-bakery-950 to-bakery-900 text-white rounded-3xl p-6 shadow-xl relative overflow-hidden">
                        <div class="absolute right-0 top-0 w-40 h-40 bg-bakery-500/10 rounded-full blur-2xl pointer-events-none"></div>
                        <div class="flex justify-between items-center mb-4">
                            <span class="text-xs font-semibold text-bakery-200 tracking-wide uppercase">Net Profit (Laba Bersih)</span>
                            <span class="bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 px-2.5 py-0.5 rounded-full text-[11px] font-bold">
                                Margin ${profitMargin}%
                            </span>
                        </div>
                        <h3 class="text-3xl font-extrabold tracking-tight mb-2">${formatIDR(netProfit)}</h3>
                        <p class="text-xs text-gray-300">Periode: <span class="font-bold text-white">${formatDisplayMonth(selectedPnlMonth)}</span></p>

                        <div class="grid grid-cols-2 gap-3 mt-6 pt-5 border-t border-white/10">
                            <div>
                                <p class="text-[11px] text-gray-400">Total Omset Kotor</p>
                                <p class="text-sm font-bold text-emerald-400 mt-0.5">${formatIDR(grossRevenue)}</p>
                            </div>
                            <div class="text-right">
                                <p class="text-[11px] text-gray-400">Total Produk Terjual</p>
                                <p class="text-sm font-bold text-bakery-200 mt-0.5">${totalItemsSold} pcs</p>
                            </div>
                        </div>
                    </div>

                    <!-- Breakdown Cards -->
                    <div class="grid grid-cols-2 gap-3">
                        <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm">
                            <div class="w-8 h-8 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center mb-2 font-bold text-xs">
                                <i class="fa-solid fa-boxes-stacked"></i>
                            </div>
                            <p class="text-[11px] text-gray-500 font-medium">Total HPP (Modal Bahan)</p>
                            <p class="text-sm font-extrabold text-gray-900 mt-1">${formatIDR(totalHpp)}</p>
                            <p class="text-[10px] text-gray-400 mt-0.5">${Math.round((totalHpp/(grossRevenue||1))*100)}% dari omset</p>
                        </div>
                        <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm">
                            <div class="w-8 h-8 rounded-xl bg-orange-50 text-bakery-600 flex items-center justify-center mb-2 font-bold text-xs">
                                <i class="fa-solid fa-receipt"></i>
                            </div>
                            <p class="text-[11px] text-gray-500 font-medium">Biaya Operasional Est.</p>
                            <p class="text-sm font-extrabold text-gray-900 mt-1">${formatIDR(operationalExpense)}</p>
                            <p class="text-[10px] text-gray-400 mt-0.5">Listrik, Gas, Gaji</p>
                        </div>
                    </div>

                    <!-- Menu Performance List in Month -->
                    <div class="bg-white rounded-3xl p-4 shadow-sm border border-gray-100 space-y-3">
                        <h3 class="text-xs font-bold text-gray-800 uppercase tracking-wide">
                            <i class="fa-solid fa-chart-line text-bakery-500 mr-1.5"></i> Performa Menu Bulan Ini
                        </h3>
            `;

            let menuStats = {};
            menuItems.forEach(m => {
                menuStats[m.id] = { name: m.name, qty: 0, revenue: 0, hpp: m.hpp * 0 };
            });

            monthBookings.forEach(b => {
                if (menuStats[b.menuId]) {
                    const menu = menuItems.find(m => m.id == b.menuId);
                    menuStats[b.menuId].qty += b.qty;
                    menuStats[b.menuId].revenue += menu.price * b.qty;

            html += `
                    </div>

        function changePnlMonth(val) {
            selectedPnlMonth = val;
            renderCurrentTab();
        }

        function formatDisplayMonth(yearMonthStr) {
            const [y, m] = yearMonthStr.split('-');
            const d = new Date(y, m - 1, 1);
            return d.toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });

        // --- 4. SETTING TAB (Full CRUD Menu Management with HPP & Selling Price) ---
        let settingMenuCategoryFilter = 'ALL';

        function renderSettingTab(container) {
            let html = `
                <div class="p-4 space-y-4">

                            <span>Tambah Menu</span>

                    <div class="flex space-x-1.5 overflow-x-auto hide-scrollbar pb-1">
            `;

            const categories = ['ALL', 'Roti Artisanal', 'Pastry & Croissant', 'Cake & Tart', 'Cookies & Snack', 'Minuman'];
            categories.forEach(cat => {
                const isActive = settingMenuCategoryFilter === cat;
                html += `
                    <button onclick="filterMenuCategory('${cat}')" class="px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition border ${isActive ? 'bg-bakery-600 text-white border-bakery-600 shadow' : 'bg-white text-gray-600 border-gray-200 hover:bg-bakery-50'}">
                        ${cat === 'ALL' ? 'Semua Kategori' : cat}
                    </button>
                `;
            });

            html += `
                    </div>

                    <!-- Menu Items List -->
                    <div class="space-y-3">
            `;

            let filteredMenus = menuItems.filter(m => settingMenuCategoryFilter === 'ALL' || m.category === settingMenuCategoryFilter);

            filteredMenus.forEach(menu => {
                const profitPerItem = menu.price - menu.hpp;
                const marginPerItem = menu.price > 0 ? Math.round((profitPerItem / menu.price) * 100) : 0;

                html += `
                    <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 space-y-2.5 relative hover:border-bakery-300 transition">
                        <div class="flex justify-between items-start">
                            <div>
                                <span class="text-[10px] font-bold text-bakery-700 bg-bakery-50 px-2 py-0.5 rounded-lg">${menu.category}</span>
                                <h4 class="font-bold text-gray-900 text-sm mt-1">${menu.name}</h4>
                                <p class="text-[11px] text-gray-500 mt-0.5">${menu.desc || 'Tanpa deskripsi'}</p>
