        // --- Pembuat PDF A4 ringan (vector, font standar Helvetica) ---
        const InvoicePDF = (() => {
            const WIDTHS = {
                F1: [278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584],
                F2: [278,333,474,556,556,889,722,238,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,333,333,584,584,584,611,975,722,722,722,722,667,611,778,722,278,556,722,611,833,722,778,667,778,722,667,611,722,667,944,667,667,611,333,278,333,584,556,333,556,611,556,611,556,333,611,611,278,278,556,278,889,611,611,611,611,389,556,333,611,556,778,556,556,500,389,280,389,584]
            };
            const PT = 72 / 25.4;          // mm -> pt
            const PAGE_W = 210, PAGE_H = 297;
            const n = (x) => (Math.round(x * 100) / 100).toString();

            // Font standar PDF hanya mendukung karakter Latin dasar
            function clean(s) {
                return String(s ?? '')
                    .replace(/[\t\r\n]+/g, ' ')
                    .normalize('NFD').replace(/[̀-ͯ]/g, '')
                    .replace(/[–—]/g, '-').replace(/[‘’]/g, "'").replace(/[“”]/g, '"')
                    .replace(/…/g, '...').replace(/[  ]/g, ' ')
                    .replace(/[^\x20-\x7E]/g, '?');
            }
            function textWidth(s, font, size) {
                let w = 0;
                for (let i = 0; i < s.length; i++) w += WIDTHS[font][s.charCodeAt(i) - 32] || 556;
                return w * size / 1000 / PT; // dalam mm
            }
            function wrap(s, font, size, maxW) {
                const words = clean(s).split(' ').filter(Boolean);
                const lines = []; let line = '';
                const pushLong = (w) => { // pecah kata yang terlalu panjang
                    let chunk = '';
                    for (const ch of w) {
                        if (textWidth(chunk + ch, font, size) > maxW && chunk) { lines.push(chunk); chunk = ''; }
                        chunk += ch;
                    }
                    return chunk;
                };
                words.forEach(w => {
                    const test = line ? line + ' ' + w : w;
                    if (textWidth(test, font, size) <= maxW) { line = test; return; }
                    if (line) lines.push(line);
                    line = textWidth(w, font, size) > maxW ? pushLong(w) : w;
                });
                if (line) lines.push(line);
                return lines.length ? lines : [''];
            }
            const esc = (s) => s.replace(/\\/g, '\\\\').replace(/\(/g, '\\(').replace(/\)/g, '\\)');
            const rgb = (c) => c.map(v => n(v / 255)).join(' ');

            class Doc {
                constructor() { this.pages = []; this.images = []; this.links = []; this.addPage(); }
                // Tautan yang bisa diklik (anotasi URI) pada halaman tertentu
                link(pageIndex, x, y, w, h, url) {
                    this.links.push({ pageIndex, rect: [x * PT, (PAGE_H - y - h) * PT, (x + w) * PT, (PAGE_H - y) * PT], url });
                }
                circle(cx, cy, r, o = {}) {
                    const X = cx * PT, Y = (PAGE_H - cy) * PT, R = r * PT, k = 0.5523 * R;
                    const path = `${n(X + R)} ${n(Y)} m ${n(X + R)} ${n(Y + k)} ${n(X + k)} ${n(Y + R)} ${n(X)} ${n(Y + R)} c ` +
                        `${n(X - k)} ${n(Y + R)} ${n(X - R)} ${n(Y + k)} ${n(X - R)} ${n(Y)} c ${n(X - R)} ${n(Y - k)} ${n(X - k)} ${n(Y - R)} ${n(X)} ${n(Y - R)} c ` +
                        `${n(X + k)} ${n(Y - R)} ${n(X + R)} ${n(Y - k)} ${n(X + R)} ${n(Y)} c h`;
                    const style = (o.fill ? `${rgb(o.fill)} rg ` : '') + (o.stroke ? `${rgb(o.stroke)} RG ${n((o.width || 0.3) * PT)} w ` : '');
                    this.ops.push(`${style}${path} ${o.fill && o.stroke ? 'B' : o.fill ? 'f' : 'S'}`);
                }
                // Sisipkan gambar JPEG (DCTDecode) dari data yang sudah didekode
                image(img, x, y, w, h) {
                    let idx = this.images.indexOf(img);
                    if (idx < 0) { this.images.push(img); idx = this.images.length - 1; }
                    this.ops.push(`q ${n(w * PT)} 0 0 ${n(h * PT)} ${n(x * PT)} ${n((PAGE_H - y - h) * PT)} cm /Im${idx + 1} Do Q`);
                }
                addPage() { this.ops = []; this.pages.push(this.ops); }
                text(str, x, y, o = {}) {
                    const font = o.font || 'F1', size = o.size || 10, s = clean(str);
                    let px = x;
                    if (o.align === 'right') px = x - textWidth(s, font, size);
                    else if (o.align === 'center') px = x - textWidth(s, font, size) / 2;
                    this.ops.push(`BT /${font} ${size} Tf ${rgb(o.color || [31,41,55])} rg ${n(px * PT)} ${n((PAGE_H - y) * PT)} Td (${esc(s)}) Tj ET`);
                }
                line(x1, y1, x2, y2, o = {}) {
                    this.ops.push(`${rgb(o.color || [229,231,235])} RG ${n((o.width || 0.3) * PT)} w ${n(x1 * PT)} ${n((PAGE_H - y1) * PT)} m ${n(x2 * PT)} ${n((PAGE_H - y2) * PT)} l S`);
                }
                rect(x, y, w, h, o = {}) {
                    const r = Math.min(o.radius || 0, w / 2, h / 2);
                    const X = x * PT, Y = (PAGE_H - y - h) * PT, W = w * PT, H = h * PT, R = r * PT, k = 0.5523 * R;
                    let path;
                    if (!R) path = `${n(X)} ${n(Y)} ${n(W)} ${n(H)} re`;
                    else path = [
                        `${n(X + R)} ${n(Y)} m`, `${n(X + W - R)} ${n(Y)} l`,
                        `${n(X + W - R + k)} ${n(Y)} ${n(X + W)} ${n(Y + R - k)} ${n(X + W)} ${n(Y + R)} c`,
                        `${n(X + W)} ${n(Y + H - R)} l`,
                        `${n(X + W)} ${n(Y + H - R + k)} ${n(X + W - R + k)} ${n(Y + H)} ${n(X + W - R)} ${n(Y + H)} c`,
                        `${n(X + R)} ${n(Y + H)} l`,
                        `${n(X + R - k)} ${n(Y + H)} ${n(X)} ${n(Y + H - R + k)} ${n(X)} ${n(Y + H - R)} c`,
                        `${n(X)} ${n(Y + R)} l`,
                        `${n(X)} ${n(Y + R - k)} ${n(X + R - k)} ${n(Y)} ${n(X + R)} ${n(Y)} c h`
                    ].join(' ');
                    let paint = 'n';
                    let style = '';
                    if (o.fill) style += `${rgb(o.fill)} rg `;
                    if (o.stroke) style += `${rgb(o.stroke)} RG ${n((o.width || 0.3) * PT)} w `;
                    if (o.fill && o.stroke) paint = 'B'; else if (o.fill) paint = 'f'; else if (o.stroke) paint = 'S';
                    this.ops.push(`${style}${path} ${paint}`);
                }
                polygon(points, fill) {
                    this.ops.push(`${rgb(fill)} rg ` + points.map(([x, y], i) => `${n(x * PT)} ${n((PAGE_H - y) * PT)} ${i ? 'l' : 'm'}`).join(' ') + ' h f');
                }
                ellipse(cx, cy, rx, ry, angleDeg, fill) {
                    const a = angleDeg * Math.PI / 180, c = Math.cos(a), s = Math.sin(a);
                    const RX = rx * PT, RY = ry * PT, kx = 0.5523 * RX, ky = 0.5523 * RY;
                    this.ops.push(`q ${n(c)} ${n(s)} ${n(-s)} ${n(c)} ${n(cx * PT)} ${n((PAGE_H - cy) * PT)} cm ${rgb(fill)} rg ` +
                        `${n(RX)} 0 m ${n(RX)} ${n(ky)} ${n(kx)} ${n(RY)} 0 ${n(RY)} c ${n(-kx)} ${n(RY)} ${n(-RX)} ${n(ky)} ${n(-RX)} 0 c ` +
                        `${n(-RX)} ${n(-ky)} ${n(-kx)} ${n(-RY)} 0 ${n(-RY)} c ${n(kx)} ${n(-RY)} ${n(RX)} ${n(-ky)} ${n(RX)} 0 c f Q`);
                }
                toBlob(title) {
                    const objs = [];
                    const add = (s) => { objs.push(s); return objs.length; };
                    const catalogId = add(null), pagesId = add(null);
                    const f1 = add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
                    const f2 = add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
                    // Objek gambar: { head, bytes } -> ditulis sebagai stream biner
                    const imgIds = this.images.map(img => add({
                        head: `<< /Type /XObject /Subtype /Image /Width ${img.width} /Height ${img.height} /ColorSpace /${img.colorSpace} /BitsPerComponent 8 /Filter /DCTDecode /Length ${img.bytes.length} >>`,
                        bytes: img.bytes
                    }));
                    const xobj = imgIds.length ? ` /XObject << ${imgIds.map((id, i) => `/Im${i + 1} ${id} 0 R`).join(' ')} >>` : '';
                    const kids = [];
                    this.pages.forEach((ops, pageIndex) => {
                        const content = ops.join('\n');
                        const cId = add(`<< /Length ${content.length} >>\nstream\n${content}\nendstream`);
                        const annotIds = this.links.filter(l => l.pageIndex === pageIndex).map(l =>
                            add(`<< /Type /Annot /Subtype /Link /Rect [${l.rect.map(n).join(' ')}] /Border [0 0 0] /A << /S /URI /URI (${esc(clean(l.url))}) >> >>`));
                        const annots = annotIds.length ? ` /Annots [${annotIds.map(id => id + ' 0 R').join(' ')}]` : '';
                        kids.push(add(`<< /Type /Page /Parent ${pagesId} 0 R /MediaBox [0 0 ${n(PAGE_W * PT)} ${n(PAGE_H * PT)}] /Resources << /Font << /F1 ${f1} 0 R /F2 ${f2} 0 R >>${xobj} >> /Contents ${cId} 0 R${annots} >>`));
                    });
                    objs[catalogId - 1] = `<< /Type /Catalog /Pages ${pagesId} 0 R >>`;
                    objs[pagesId - 1] = `<< /Type /Pages /Kids [${kids.map(k => k + ' 0 R').join(' ')}] /Count ${kids.length} >>`;
                    const infoId = add(`<< /Title (${esc(clean(title))}) /Producer (Daily Bread App) >>`);

                    // Ditulis sebagai byte (teks ASCII + stream biner gambar) agar offset xref akurat
                    const enc = new TextEncoder();
                    const parts = [];
                    let len = 0;
                    const push = (chunk) => { const b = typeof chunk === 'string' ? enc.encode(chunk) : chunk; parts.push(b); len += b.length; };
                    push('%PDF-1.4\n');
                    push(new Uint8Array([0x25, 0xE2, 0xE3, 0xCF, 0xD3, 0x0A])); // penanda file biner
                    const offsets = [];
                    objs.forEach((o, i) => {
                        offsets.push(len);
                        if (typeof o === 'string') { push(`${i + 1} 0 obj\n${o}\nendobj\n`); return; }
                        push(`${i + 1} 0 obj\n${o.head}\nstream\n`);
                        push(o.bytes);
                        push('\nendstream\nendobj\n');
                    });
                    const xref = len;
                    let tail = `xref\n0 ${objs.length + 1}\n0000000000 65535 f \n`;
                    offsets.forEach(off => { tail += String(off).padStart(10, '0') + ' 00000 n \n'; });
                    tail += `trailer\n<< /Size ${objs.length + 1} /Root ${catalogId} 0 R /Info ${infoId} 0 R >>\nstartxref\n${xref}\n%%EOF`;
                    push(tail);
                    return new Blob(parts, { type: 'application/pdf' });
                }
            }

            const C = {
                orange: [234,88,12], orangeDark: [194,65,12], brown: [154,52,18], cream: [255,247,237],
                ink: [17,24,39], text: [31,41,55], muted: [107,114,128], light: [229,231,235], white: [255,255,255]
            };
            const M = 18, RIGHT = PAGE_W - M, BOTTOM = PAGE_H - 26;

            // Dekode LOGO_SRC (data URL JPEG) sekali -> byte + ukuran piksel untuk PDF
            let logoImageCache = null;
            function getLogoImage() {
                if (logoImageCache) return logoImageCache;
                const b64 = String(LOGO_SRC).split(',')[1] || '';
                const bin = atob(b64);
                const bytes = new Uint8Array(bin.length);
                for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
                if (bytes[0] !== 0xFF || bytes[1] !== 0xD8) throw new Error('Logo bukan file JPEG yang valid.');
                let i = 2, width = 0, height = 0, comps = 0;
                while (i < bytes.length) {
                    if (bytes[i] !== 0xFF) { i++; continue; }
                    const marker = bytes[i + 1];
                    const segLen = (bytes[i + 2] << 8) | bytes[i + 3];
                    if (marker >= 0xC0 && marker <= 0xCF && ![0xC4, 0xC8, 0xCC].includes(marker)) {
                        height = (bytes[i + 5] << 8) | bytes[i + 6];
                        width = (bytes[i + 7] << 8) | bytes[i + 8];
                        comps = bytes[i + 9];
                        break;
                    }
                    i += 2 + segLen;
                }
                if (!width || !height) throw new Error('Ukuran logo tidak terbaca.');
                logoImageCache = { bytes, width, height, colorSpace: comps === 1 ? 'DeviceGray' : 'DeviceRGB' };
                return logoImageCache;
            }
            const LOGO_PDF_H = 24; // mm

            function drawLogo(doc, x, y) {
                const img = getLogoImage();
                const w = LOGO_PDF_H * img.width / img.height; // rasio aspek dipertahankan
                doc.image(img, x, y, w, LOGO_PDF_H);
                return w;
            }

            // Ikon Instagram vektor (kotak bersudut + lingkaran + titik), warna oranye invoice
            function drawInstagramIcon(doc, x, y, size) {

                doc.circle(x + size / 2, y + size / 2, size * 0.22, { stroke: C.orange, width: lw });
                doc.circle(x + size * 0.76, y + size * 0.24, size * 0.055, { fill: C.orange });
            }
            // Blok "Follow us on Instagram / @daily.breadkd" di tengah footer (halaman terakhir), dapat diklik
            function drawInstagram(doc, pageIndex) {
                const icon = 4.6, gap = 2;
                const textW = Math.max(textWidth(INSTAGRAM_INFO.label, 'F1', 7.5), textWidth(INSTAGRAM_INFO.handle, 'F2', 8.5));

            const PAY_CARD_H = 31;
            const PAY_STYLES = {
                bank:   { font: 'F2', size: 10,   color: C.ink },
                name:   { font: 'F1', size: 9,    color: [55,65,81] },

            function drawBankIcon(doc, x, y, size) {

            // Kartu ringkas di kiri: lebar mengikuti isi, maksimal 50% area konten
            function drawPaymentInfo(doc, y) {
                const pad = 4, icon = 4.2, x = M;
                const contentW = Math.max(
                    icon + 2 + textWidth(PAYMENT_INFO.title, 'F2', 7.5),
                    ...PAYMENT_INFO.rows.map(r => textWidth(r.value, PAY_STYLES[r.style].font, PAY_STYLES[r.style].size)),
                    textWidth(PAYMENT_INFO.note, 'F1', 7.5)
                );
                const w = Math.min((RIGHT - M) * 0.5, Math.max(66, contentW + pad * 2));
                doc.rect(x, y, w, PAY_CARD_H, { fill: C.cream, stroke: [253,186,116], width: 0.25, radius: 1.5 });
                drawBankIcon(doc, x + pad, y + 3.3, icon);
                doc.text(PAYMENT_INFO.title, x + pad + icon + 2, y + 6.5, { font: 'F2', size: 7.5, color: C.orangeDark });
                let ry = y + 12.6;
                PAYMENT_INFO.rows.forEach(r => {
                    doc.text(r.value, x + pad, ry, PAY_STYLES[r.style]);
                    ry += r.style === 'bank' ? 4.6 : 4.8;
                });
                doc.text(PAYMENT_INFO.note, x + pad, y + PAY_CARD_H - 3.2, { size: 7.5, color: C.muted });
            }

            const COLS = [
                { key: 'no',  label: 'No',           x: M,     w: 10, align: 'center' },
                { key: 'prd', label: 'Produk',       x: M + 10, w: 80, align: 'left' },
                { key: 'qty', label: 'Qty',          x: M + 90, w: 16, align: 'center' },
                { key: 'prc', label: 'Harga Satuan', x: M + 106, w: 33, align: 'right' },
                { key: 'sub', label: 'Subtotal',     x: M + 139, w: 35, align: 'right' }
            ];
            const PAD = 2.5;
            const cellX = (col) => col.align === 'right' ? col.x + col.w - PAD : col.align === 'center' ? col.x + col.w / 2 : col.x + PAD;

            function drawTableHeader(doc, y) {
                doc.rect(M, y, RIGHT - M, 8, { fill: C.orangeDark });
                COLS.forEach(col => doc.text(col.label, cellX(col), y + 5.4, { font: 'F2', size: 8.5, color: C.white, align: col.align }));
                return y + 8;
            }

            function create(data) {
                const doc = new Doc();
                const money = (x) => x === null ? '-' : formatRupiah(x);
                const dash = (x) => (x === null || x === undefined || x === '') ? '-' : String(x);
                const newPage = () => { doc.addPage(); doc.rect(0, 0, PAGE_W, 5, { fill: C.orange }); return 20; };

                // Header
                doc.rect(0, 0, PAGE_W, 5, { fill: C.orange });
                const logoW = drawLogo(doc, M, 10.5);   // tinggi 24 mm, tengah vertikal di y = 22.5
                doc.text(BUSINESS_INFO.name, M + logoW + 5, 22, { font: 'F2', size: 18, color: C.ink });
                doc.text(BUSINESS_INFO.tagline, M + logoW + 5, 28, { size: 9.5, color: C.muted });
                doc.text('INVOICE', RIGHT, 25, { font: 'F2', size: 26, color: C.orangeDark, align: 'right' });
                doc.text('No. ' + data.number, RIGHT, 31.5, { font: 'F2', size: 9.5, color: C.text, align: 'right' });
                doc.line(M, 39, RIGHT, 39, { color: C.light, width: 0.3 });

                // Info pelanggan (kiri)
                let yL = 48;
                doc.text('DITAGIHKAN KEPADA', M, yL, { font: 'F2', size: 8, color: C.muted });
                yL += 7;
                wrap(dash(data.customer), 'F2', 13, 88).forEach(l => { doc.text(l, M, yL, { font: 'F2', size: 13, color: C.ink }); yL += 5.8; });

                // Detail pesanan (kanan)
                const mx = 118;
                let yR = 48;
                [['Tanggal Invoice', data.invoiceDate], ['Tanggal Pesanan', data.orderDate], ['Waktu Ambil/Kirim', data.orderTime], ['ID Pesanan', data.orderId]]
                    .forEach(([k, val]) => {
                        doc.text(k, mx, yR, { size: 9, color: C.muted });
                        doc.text(dash(val), RIGHT, yR, { font: 'F2', size: 9, color: C.ink, align: 'right' });
                        yR += 6.2;
                    });

                // Tabel produk
                let y = Math.max(yL, yR) + 8;
                y = drawTableHeader(doc, y);
                data.items.forEach((it, idx) => {
                    const nameLines = it.name ? wrap(it.name, 'F2', 9.5, COLS[1].w - PAD * 2) : ['Produk tidak tersedia (menu telah dihapus)'];
                    const subLines = [];
                    if (it.category) subLines.push(...wrap(it.category, 'F1', 8, COLS[1].w - PAD * 2));
                    if (it.desc) subLines.push(...wrap(it.desc, 'F1', 8, COLS[1].w - PAD * 2));
                    const rowH = 4 + nameLines.length * 4.4 + subLines.length * 3.8 + 2.5;
                    if (y + rowH > BOTTOM) { y = drawTableHeader(doc, newPage()); }
                    let ty = y + 6;
                    doc.text(String(idx + 1), cellX(COLS[0]), ty, { size: 9.5, align: 'center' });
                    doc.text(String(it.qty), cellX(COLS[2]), ty, { size: 9.5, align: 'center' });
                    doc.text(money(it.unitPrice), cellX(COLS[3]), ty, { size: 9.5, align: 'right' });
                    doc.text(money(it.subtotal), cellX(COLS[4]), ty, { font: 'F2', size: 9.5, align: 'right', color: C.ink });
                    nameLines.forEach(l => { doc.text(l, cellX(COLS[1]), ty, { font: it.name ? 'F2' : 'F1', size: 9.5, color: it.name ? C.ink : C.muted }); ty += 4.4; });
                    subLines.forEach(l => { doc.text(l, cellX(COLS[1]), ty - 0.4, { size: 8, color: C.muted }); ty += 3.8; });
                    y += rowH;
                    doc.line(M, y, RIGHT, y, { color: C.light, width: 0.3 });
                });

                // Total
                if (y + 26 > BOTTOM) y = newPage();
                const tx = 118;
                y += 7;
                doc.text('Subtotal', tx, y, { size: 9.5, color: C.muted });
                doc.text(money(data.total), RIGHT, y, { font: 'F2', size: 9.5, color: C.ink, align: 'right' });
                y += 4;
                doc.rect(tx - 3, y, RIGHT - tx + 3, 11, { fill: C.cream, stroke: C.orange, width: 0.4, radius: 2 });
                doc.text('Total Pembayaran', tx, y + 7, { font: 'F2', size: 10, color: C.ink });
                doc.text(money(data.total), RIGHT - 3, y + 7.2, { font: 'F2', size: 13, color: C.brown, align: 'right' });
                y += 11;

                // Informasi pembayaran (dipindah utuh ke halaman berikut jika tidak muat)
                y += 8;
                if (y + PAY_CARD_H > BOTTOM) y = newPage();
                drawPaymentInfo(doc, y);
                y += PAY_CARD_H;

                // Catatan
                if (data.notes) {
                    y += 10;
                    if (y + 16 > BOTTOM) y = newPage();
                    doc.text('CATATAN PESANAN', M, y, { font: 'F2', size: 8, color: C.muted });
                    y += 3;
                    let lines = wrap(data.notes, 'F1', 9.5, RIGHT - M - 10);
                    while (lines.length) {
                        const fit = Math.max(1, Math.floor((BOTTOM - y - 6) / 4.6));
                        const chunk = lines.splice(0, fit);
                        const h = chunk.length * 4.6 + 5;
                        doc.rect(M, y, RIGHT - M, h, { stroke: C.light, width: 0.3, radius: 1.5 });
                        doc.rect(M, y, 1.2, h, { fill: C.orange });
                        let ly = y + 6;
                        chunk.forEach(l => { doc.text(l, M + 5, ly, { size: 9.5 }); ly += 4.6; });
                        y += h;
                        if (lines.length) y = newPage();
                    }
                }

                // Footer di setiap halaman
                const total = doc.pages.length;
                doc.pages.forEach((ops, i) => {
                    doc.ops = ops;
                    doc.line(M, PAGE_H - 18, RIGHT, PAGE_H - 18, { color: C.light, width: 0.3 });
                    doc.text(`Terima kasih telah berbelanja di ${BUSINESS_INFO.name}.`, M, PAGE_H - 13, { size: 8, color: C.muted });
                    doc.text(`Dicetak: ${data.printedAt}`, M, PAGE_H - 9, { size: 8, color: C.muted });
                    doc.text(`${BUSINESS_INFO.name} - ${BUSINESS_INFO.tagline}`, RIGHT, PAGE_H - 13, { size: 8, color: C.muted, align: 'right' });
                    doc.text(`Halaman ${i + 1} dari ${total}`, RIGHT, PAGE_H - 9, { size: 8, color: C.muted, align: 'right' });
                    if (i === total - 1) drawInstagram(doc, i);
                });

                return doc.toBlob(`Invoice ${data.number}`);
            }

            return { create };
        })();

        function invoiceFileName(data) {
            const slug = String(data.customer || 'Pelanggan')
                .normalize('NFD').replace(/[̀-ͯ]/g, '')
                .replace(/[^A-Za-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'Pelanggan';
            return `Invoice-Daily-Bread-${data.number}-${slug}.pdf`;
        }

        // --- Kontrol modal invoice ---
        let currentInvoiceData = null;

        function setInvoiceState(state, msg) {
            const loading = document.getElementById('invoice-loading');
            const wrap = document.getElementById('invoice-scale-wrap');
            const alertBox = document.getElementById('invoice-alert');
            loading.classList.toggle('hidden', state !== 'loading');
            wrap.classList.toggle('hidden', state !== 'ready');
            if (state === 'loading') document.getElementById('invoice-loading-msg').innerText = msg || 'Menyiapkan invoice...';
            if (state === 'error') showInvoiceError(msg);
            else alertBox.classList.add('hidden');
        }

        // Pesan ditampilkan di dalam modal invoice (tidak memakai toast global)
        function showInvoiceMessage(msg, type = 'error') {
            const box = document.getElementById('invoice-alert');
            const ok = type === 'success';
            box.className = `${ok ? 'bg-emerald-50 border-emerald-200 text-emerald-700' : 'bg-red-50 border-red-200 text-red-700'} border rounded-2xl px-4 py-3 text-xs font-medium flex items-start space-x-2.5`;
            box.setAttribute('role', ok ? 'status' : 'alert');
            document.getElementById('invoice-alert-icon').className = ok ? 'fa-solid fa-circle-check text-emerald-500 text-sm mt-0.5' : 'fa-solid fa-circle-exclamation text-red-500 text-sm mt-0.5';
            document.getElementById('invoice-alert-msg').innerText = msg;
            document.getElementById('invoice-body').scrollTop = 0;
        }
        function showInvoiceError(msg) { showInvoiceMessage(msg, 'error'); }

        function fitInvoicePreview() {
            const wrap = document.getElementById('invoice-scale-wrap');
            const paper = document.getElementById('invoice-paper');
            if (!wrap || wrap.classList.contains('hidden')) return;
            const avail = wrap.parentElement.clientWidth - 24; // p-3 kiri + kanan
            const scale = Math.min(1, avail / 794);
            paper.style.transform = `scale(${scale})`;
            wrap.style.width = (794 * scale) + 'px';
            wrap.style.height = (paper.offsetHeight * scale) + 'px';
        }

        const invoiceResizeObserver = ('ResizeObserver' in window) ? new ResizeObserver(() => fitInvoicePreview()) : null;
        window.addEventListener('resize', fitInvoicePreview);

        function setDownloadBusy(busy) {
            const btn = document.getElementById('invoice-download-btn');
            btn.disabled = busy || !currentInvoiceData;
            document.getElementById('invoice-download-icon').className = busy ? 'fa-solid fa-spinner fa-spin text-xs' : 'fa-solid fa-file-arrow-down text-xs';
            document.getElementById('invoice-download-label').innerText = busy ? 'Membuat PDF...' : 'Download PDF';
        }

        function openInvoicePreview(orderId) {
            currentInvoiceData = null;
            document.getElementById('invoice-modal-subtitle').innerText = '';
            document.getElementById('invoice-modal').classList.remove('hidden');
            setDownloadBusy(false);
            setInvoiceState('loading');

            // Beri waktu 1 frame agar indikator loading tampil
            setTimeout(() => {
                try {
                    const data = buildInvoiceData(orderId);
                    const paper = document.getElementById('invoice-paper');
                    paper.innerHTML = renderInvoiceHTML(data);
                    currentInvoiceData = data;
                    document.getElementById('invoice-modal-subtitle').innerText = `No. ${data.number}`;
                    setInvoiceState('ready');
                    setDownloadBusy(false);
                    fitInvoicePreview();
                    if (invoiceResizeObserver) invoiceResizeObserver.observe(paper);
                } catch (err) {
                    console.error(err);
                    setInvoiceState('error', 'Gagal membuat invoice: ' + (err && err.message ? err.message : 'terjadi kesalahan tidak dikenal.'));
                }
            }, 60);
        }

        function closeInvoicePreview() {
            document.getElementById('invoice-modal').classList.add('hidden');
            if (invoiceResizeObserver) invoiceResizeObserver.disconnect();
            currentInvoiceData = null;
        }

        function downloadCurrentInvoice() {
            if (!currentInvoiceData) {
                showInvoiceError('Invoice belum siap. Tutup lalu coba buka kembali.');
                return;
            }
            const data = currentInvoiceData;
            document.getElementById('invoice-alert').classList.add('hidden');
            setDownloadBusy(true);
            setTimeout(() => {
                try {
                    const blob = InvoicePDF.create(data);
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = invoiceFileName(data);
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    setTimeout(() => URL.revokeObjectURL(url), 10000);
                    showInvoiceMessage(`Invoice berhasil diunduh: ${a.download}`, 'success');
                } catch (err) {
                    console.error(err);
                    showInvoiceError('Gagal mengunduh invoice PDF: ' + (err && err.message ? err.message : 'terjadi kesalahan tidak dikenal.') + ' Silakan coba lagi.');
                } finally {
                    setDownloadBusy(false);
                }
            }, 60);
        }

        // Pasang logo dari sumber tunggal ke semua <img data-app-logo>
        function applyAppLogo() {
            document.querySelectorAll('img[data-app-logo]').forEach(img => { img.src = LOGO_SRC; });
        }
        applyAppLogo();

        // Initial render on window load
        window.onload = function() {
            renderCurrentTab();
        };
    </script>
</body>
